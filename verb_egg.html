.egg-half path{fill:url(#eggShade);stroke:#b29b66;stroke-width:3;stroke-linejoin:round}
.egg-tap.egg-cleared .egg-shell{opacity:1}
.egg-cleared .egg-intact,.egg-cleared .egg-crack{visibility:hidden}
.egg-cleared .egg-half{opacity:1}
.egg-cleared .egg-half-left{animation:egg-open-left 400ms ease-out both}
.egg-cleared .egg-half-right{animation:egg-open-right 400ms ease-out both}
@keyframes egg-open-left{from{transform:translate(0,0) rotate(0)}to{transform:translate(-28px,18px) rotate(-24deg)}}
@keyframes egg-open-right{from{transform:translate(0,0) rotate(0)}to{transform:translate(28px,18px) rotate(24deg)}}
@media(prefers-reduced-motion:reduce){.egg-cleared .egg-half-left{animation:none;transform:translate(-28px,18px) rotate(-24deg)}.egg-cleared .egg-half-right{animation:none;transform:translate(28px,18px) rotate(24deg)}}

.egg-orbit .egg-word-long{font-size:21px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding-left:6px;padding-right:6px}.egg-word-long .egg-syllable{min-width:0;padding:2px}@media(max-width:600px){.egg-orbit .egg-word-long{font-size:19px}}

 document.getElementById('eggMode').value=settings.mode;document.getElementById('eggTempo').value=String(settings.tempo);document.getElementById('eggSound').checked=settings.sound;document.getElementById('eggEffects').checked=settings.effects!==false;document.getElementById('eggFree').checked=settings.free;document.getElementById('eggStart').onclick=start;document.getElementById('eggStop').onclick=()=>{stopSpeech();stop()};const syncMixed=()=>{document.getElementById('eggMixedForms').hidden=document.getElementById('eggMode').value!=='mixed'};syncMixed();document.getElementById('eggMode').onchange=()=>{if(active)stop();syncMixed()};document.querySelectorAll('[data-mixed-mode]').forEach(box=>box.onchange=saveMixedSelection);document.getElementById('eggSelectAll').onclick=()=>setAllMixed(true);document.getElementById('eggClearAll').onclick=()=>setAllMixed(false);queue=[forms[settings.mode][0]];index=0;renderEgg(true);

function renderEgg(preview=false){const q=current(),count=[...q.kana].length;taps=0;locked=false;lastTap=-Infinity;phase=preview?'idle':settings.free?'play':'ready';countdown=3;const bank=kanaBank(q),middle=Math.ceil(bank.length/2);document.getElementById('eggRound').textContent='EGG '+(index+1);

})();

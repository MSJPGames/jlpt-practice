らになりました。工事のあと、道のそうじもしますが、そのときは車が通れます。あしたは、川の近くの道を通ってください。では、いい一日を。"},{"speaker":"N","text":"あした、山の道はどうして通れませんか。"}]},"N5-L-0040@1":{"uid":"N5-L-0040","revision":1,"audio":"audio/n5_q3_01.mp3","script":[{"speaker":"N","text":"駅の窓口で、旅行の切符を買います。学生のねだんで買いたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、学生のねだんで買ってもいいですか。","choice":1},{"speaker":"M","text":"に、学生の切手を買ってもいいですか。","choice":2},{"speaker":"M","text":"さん、学生のねだんで売ってもいいですよ。","choice":3}]},"N5-L-0041@1":{"uid":"N5-L-0041","revision":1,"audio":"audio/n5_q3_02.mp3","script":[{"speaker":"N","text":"お祭りで、女の子に会いました。もりたさんの妹だと思います。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、もりたさんの妹さんですか。","choice":1},{"speaker":"F","text":"に、もりたさんのお姉さんは元気ですか。","choice":2},{"speaker":"F","text":"さん、わたしはもりたさんの妹です。","choice":3}]},"N5-L-0042@1":{"uid":"N5-L-0042","revision":1,"audio":"audio/n5_q3_03.mp3","script":[{"speaker":"N","text":"店で友だちと食べています。友だちの顔が赤くて、元気がありません。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、だいじょうぶですか。休みましょうか。","choice":1},{"speaker":"F","text":"に、わたしは体が痛かったです。","choice":2},{"speaker":"F","text":"さん、元気そうですね。もっと食べましょうか。","choice":3}]},"N5-L-0043@1":{"uid":"N5-L-0043","revision":1,"audio":"audio/n5_q3_04.mp3","script":[{"speaker":"N","text":"サークルの友だちと、まちの行事の手伝いに行く約束をしましたが、休みました。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、あしたも休んでもいいですか。","choice":1},{"speaker":"M","text":"に、休んでしまって、ごめんなさい。","choice":2},{"speaker":"M","text":"さん、まちのお祭りはとても楽しかったですね。","choice":3}]},"N5-L-0044@1":{"uid":"N5-L-0044","revision":1,"audio":"audio/n5_q3_05.mp3","script":[{"speaker":"N","text":"病院の前に、友だちが自転車を止めました。ここは止めてはいけません。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、自転車で来ましょう。","choice":1},{"speaker":"F","text":"に、先に薬をもらってから、自転車を止めましょう。","choice":2},{"speaker":"F","text":"さん、ここに自転車を止めてはいけませんよ。","choice":3}]},"N5-L-0045@1":{"uid":"N5-L-0045","revision":1,"audio":"audio/n5_q3_06.mp3","script":[{"speaker":"N","text":"家で、弟がテストで百点を取りました。弟をほめたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、わたしも百点を取りたいです。","choice":1},{"speaker":"F","text":"に、百点のテストが三つもありますね。","choice":2},{"speaker":"F","text":"さん、すごいね。よくがんばりましたね。","choice":3}]},"N5-L-0046@1":{"uid":"N5-L-0046","revision":1,"audio":"audio/n5_q3_07.mp3","script":[{"speaker":"N","text":"テレビ局でアルバイトをしています。今日で終わりです。みんなにお礼を言います。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、あしたからも、どうぞよろしくお願いします。","choice":1},{"speaker":"M","text":"に、みなさん、ありがとうございました。","choice":2},{"speaker":"M","text":"さん、アルバイトを始めたいです。","choice":3}]},"N5-L-0047@1":{"uid":"N5-L-0047","revision":1,"audio":"audio/n5_q3_08.mp3","script":[{"speaker":"N","text":"教室で友だちに、うちのそうじを手伝ってと言われましたが、時間がありません。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、はい、わたしのうちをそうじしてください。","choice":1},{"speaker":"F","text":"に、ごめんなさい。今日は時間がありません。","choice":2},{"speaker":"F","text":"さん、では、いっしょにそうじしましょう。","choice":3}]},"N5-L-0048@1":{"uid":"N5-L-0048","revision":1,"audio":"audio/n5_q3_09.mp3","script":[{"speaker":"N","text":"会社で、昼ご飯を食べに行きます。部長より先に部屋を出ます。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、お昼ご飯に行ってきます。","choice":1},{"speaker":"M","text":"に、お昼ご飯はおいしかったですか。","choice":2},{"speaker":"M","text":"さん、お昼ご飯を食べてきました。","choice":3}]},"N5-L-0049@1":{"uid":"N5-L-0049","revision":1,"audio":"audio/n5_q3_10.mp3","script":[{"speaker":"N","text":"図書館で、コピーの機械の使い方がわかりません。近くの人に聞きます。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、この本を売ってください。","choice":1},{"speaker":"F","text":"に、コピーの機械の使い方を教えましょうか。","choice":2},{"speaker":"F","text":"さん、すみません、使い方を教えてください。","choice":3}]},"N5-L-0050@1":{"uid":"N5-L-0050","revision":1,"audio":"audio/n5_q3_11.mp3","script":[{"speaker":"N","text":"会社で、同僚がテニスの道具をたくさん持っていて、重そうです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、重いですから、持ってください。","choice":1},{"speaker":"M","text":"に、一つ持ちましょうか。","choice":2},{"speaker":"M","text":"さん、さくらさんが持ってくれますよ。","choice":3}]},"N5-L-0051@1":{"uid":"N5-L-0051","revision":1,"audio":"audio/n5_q3_12.mp3","script":[{"speaker":"N","text":"学校の事務室で、留学生が日本の習慣を知りたいと言っています。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、わたしも習慣を教えてください。","choice":1},{"speaker":"F","text":"に、お茶の教室に行ってみませんか。","choice":2},{"speaker":"F","text":"さん、日本の習慣は知らなくてもいいです。","choice":3}]},"N5-L-0052@1":{"uid":"N5-L-0052","revision":1,"audio":"audio/n5_q3_13.mp3","script":[{"speaker":"N","text":"友だちが旅行のおみやげをくれました。お礼を言います。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、旅行はいつからですか。","choice":1},{"speaker":"M","text":"に、じゃあ、いっしょに買いに行きましょう。","choice":2},{"speaker":"M","text":"さん、ありがとう。うれしいです。","choice":3}]},"N5-L-0053@1":{"uid":"N5-L-0053","revision":1,"audio":"audio/n5_q3_14.mp3","script":[{"speaker":"N","text":"ホテルの庭で、花のえだを折ってしまいました。ホテルの人に言います。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、すみません。花を折りました。","choice":1},{"speaker":"F","text":"に、庭の犬が花を食べていましたよ。","choice":2},{"speaker":"F","text":"さん、花に水をやってもいいですか。","choice":3}]},"N5-L-0054@1":{"uid":"N5-L-0054","revision":1,"audio":"audio/n5_q3_15.mp3","script":[{"speaker":"N","text":"店で、友だちが二つのかばんを見ています。青いほうが安くていいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、かばんは先週買いましたね。","choice":1},{"speaker":"M","text":"に、先に高いほうを買ってから決めましょう。","choice":2},{"speaker":"M","text":"さん、青いかばんはどうですか。","choice":3}]},"N5-L-0055@1":{"uid":"N5-L-0055","revision":1,"audio":"audio/n5_q4_01.mp3","script":[{"speaker":"M","text":"くすりは、朝と夜とどちらがいいですか。"},{"speaker":"F","text":"いち、朝がいいですよ。","choice":1},{"speaker":"F","text":"に、夜はよく眠れますね。","choice":2},{"speaker":"F","text":"さん、薬局は駅の前にあります。","choice":3}]},"N5-L-0056@1":{"uid":"N5-L-0056","revision":1,"audio":"audio/n5_q4_02.mp3","script":[{"speaker":"F","text":"駅まで車で送りましょうか。"},{"speaker":"M","text":"いち、駅は九時に開きます。","choice":1},{"speaker":"M","text":"に、ありがとうございます。歩いて帰ります。","choice":2},{"speaker":"M","text":"さん、じゃあ、新しい車を買いに行きましょう。","choice":3}]},"N5-L-0057@1":{"uid":"N5-L-0057","revision":1,"audio":"audio/n5_q4_03.mp3","script":[{"speaker":"M","text":"土曜日のよやくが取れましたよ。"},{"speaker":"F","text":"いち、よやくはもうやめました。","choice":1},{"speaker":"F","text":"に、よかったです。楽しみです。","choice":2},{"speaker":"F","text":"さん、では、日曜日の朝に行きましょう。","choice":3}]},"N5-L-0058@1":{"uid":"N5-L-0058","revision":1,"audio":"audio/n5_q4_04.mp3","script":[{"speaker":"M","text":"今日は寒いですね。何を飲みますか。"},{"speaker":"F","text":"いち、あたたかいお茶にします。","choice":1},{"speaker":"F","text":"に、外は雪がふっていますよ。","choice":2},{"speaker":"F","text":"さん、はい、雨がやみました。","choice":3}]},"N5-L-0059@1":{"uid":"N5-L-0059","revision":1,"audio":"audio/n5_q4_05.mp3","script":[{"speaker":"F","text":"あしたからあたらしい仕事です。"},{"speaker":"M","text":"いち、わたしも仕事をやめます。","choice":1},{"speaker":"M","text":"に、そうですか。がんばってください。","choice":2},{"speaker":"M","text":"さん、おつかれさま。仕事は終わりましたね。","choice":3}]},"N5-L-0060@1":{"uid":"N5-L-0060","revision":1,"audio":"audio/n5_q4_06.mp3","script":[{"speaker":"M","text":"教室でパンを食べてもいいですか。"},{"speaker":"F","text":"いち、外で食べてくださいね。","choice":1},{"speaker":"F","text":"に、はい、わたしがパンを食べましょう。","choice":2},{"speaker":"F","text":"さん、パンは駅の店で買いました。","choice":3}]},"N5-L-0061@1":{"uid":"N5-L-0061","revision":1,"audio":"audio/n5_q4_07.mp3","script":[{"speaker":"F","text":"まちの行事のちらしをならべました。"},{"speaker":"M","text":"いち、ちらしはまだですか。","choice":1},{"speaker":"M","text":"に、ありがとう。たすかりました。","choice":2},{"speaker":"M","text":"さん、先に本をかたづけましょうか。","choice":3}]},"N5-L-0062@1":{"uid":"N5-L-0062","revision":1,"audio":"audio/n5_q4_08.mp3","script":[{"speaker":"M","text":"土曜日のおどりの練習に来てください。"},{"speaker":"F","text":"いち、はい、土曜日の練習は休みですね。","choice":1},{"speaker":"F","text":"に、おどりは去年見ました。","choice":2},{"speaker":"F","text":"さん、はい、行きます。","choice":3}]},"N5-L-0063@1":{"uid":"N5-L-0063","revision":1,"audio":"audio/n5_q4_09.mp3","script":[{"speaker":"F","text":"お祭りのチケットは千円でしたよ。"},{"speaker":"M","text":"いち、チケットは売っていません。","choice":1},{"speaker":"M","text":"に、山川さんも千円もらいましたか。","choice":2},{"speaker":"M","text":"さん、そうですか。安いですね。","choice":3}]},"N5-L-0064@1":{"uid":"N5-L-0064","revision":1,"audio":"audio/n5_q4_10.mp3","script":[{"speaker":"M","text":"重いですね。かばんを持ちましょうか。"},{"speaker":"F","text":"いち、もう旅行に行ってきました。","choice":1},{"speaker":"F","text":"に、かばんはあの店で買いました。","choice":2},{"speaker":"F","text":"さん、はい、お願いします。","choice":3}]},"N5-L-0065@1":{"uid":"N5-L-0065","revision":1,"audio":"audio/n5_q4_11.mp3","script":[{"speaker":"F","text":"テニスの申込書はどこに出しますか。"},{"speaker":"M","text":"いち、テストは来週の水曜日ですよ。","choice":1},{"speaker":"M","text":"に、事務室の箱に入れてください。","choice":2},{"speaker":"M","text":"さん、わたしもテニスがすきです。","choice":3}]},"N5-L-0066@1":{"uid":"N5-L-0066","revision":1,"audio":"audio/n5_q4_12.mp3","script":[{"speaker":"M","text":"ピアノの教室、弟も入れますか。"},{"speaker":"F","text":"いち、弟さんはピアノの先生ですね。","choice":1},{"speaker":"F","text":"に、はい、だいじょうぶですよ。","choice":2},{"speaker":"F","text":"さん、教室は六時に始まりました。","choice":3}]},"N5-L-0067@1":{"uid":"N5-L-0067","revision":1,"audio":"audio/n5_q4_13.mp3","script":[{"speaker":"M","text":"あしたの朝、七時に出ますね。"},{"speaker":"F","text":"いち、はい、七時ですね。わかりました。","choice":1},{"speaker":"F","text":"に、じゃあ、あなたが七時に出てください。","choice":2},{"speaker":"F","text":"さん、昨日の夜、七時に出ました。","choice":3}]},"N5-L-0068@1":{"uid":"N5-L-0068","revision":1,"audio":"audio/n5_q4_14.mp3","script":[{"speaker":"F","text":"ただいま。へやがきれいですね。"},{"speaker":"M","text":"いち、いってらっしゃい。気をつけてくださいね。","choice":1},{"speaker":"M","text":"に、へやはまだきたないです。","choice":2},{"speaker":"M","text":"さん、おかえりなさい。そうじしましたよ。","choice":3}]},"N5-L-0069@1":{"uid":"N5-L-0069","revision":1,"audio":"audio/n5_q4_15.mp3","script":[{"speaker":"M","text":"このコピーの機械、使いますか。"},{"speaker":"F","text":"いち、機械の使い方を教えましたよ。","choice":1},{"speaker":"F","text":"に、では、新しい機械を買いましょう。","choice":2},{"speaker":"F","text":"さん、いいえ、今はだいじょうぶです。","choice":3}]},"N5-L-0070@1":{"uid":"N5-L-0070","revision":1,"audio":"audio/n5_q4_16.mp3","script":[{"speaker":"M","text":"電車に犬を乗せてもいいですか。"},{"speaker":"F","text":"いち、かばんに入れてください。","choice":1},{"speaker":"F","text":"に、電車は三番線から出ます。","choice":2},{"speaker":"F","text":"さん、はい、犬もかわいいですね。","choice":3}]},"N5-L-00

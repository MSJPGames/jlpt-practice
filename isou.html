<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>位相チェッカー ・ Register Checker ・ 日本語の部屋</title>
<meta name="description" content="入力した日本語の「丁寧さ」と「硬さ」を場面ごとに調べ、言いかえの候補を示します。上級者の「話し方が硬い」「文末だけ敬体」を自分で直すための道具です。">
<style>
  :root{
    --bg:#F7F5F0; --surface:#FFFFFF; --border:#E2DDD6;
    --text:#1C1C1C; --text-muted:#6B6560; --text-hint:#9E9890;
    --radius:14px; --radius-sm:10px;
    --accent:#3C3489; --accent-bg:#EEEDFE;
    --ok:#3B6D11; --ok-bg:#EAF3DE;
    --ng:#9A3D1C; --ng-bg:#FAECE7;
    --s1:#9A3D1C; --s1b:#FAECE7;
    --s2:#854F0B; --s2b:#FAEEDA;
    --s3:#3B6D11; --s3b:#EAF3DE;
    --s4:#1F6F6B; --s4b:#DFF0EE;
    --s5:#185FA5; --s5b:#E6F1FB;
    --s6:#3C3489; --s6b:#EEEDFE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;padding:0 1rem 3rem;line-height:1.75;-webkit-text-size-adjust:100%}
  .container{max-width:520px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:5px;margin-top:1.25rem;margin-right:12px;font-size:13px;font-weight:600;color:var(--text-muted);text-decoration:none}
  .back:hover{color:var(--text)}
  .app-header{text-align:center;padding:1.1rem 0 .6rem}
  .app-logo{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--text-hint);margin-bottom:8px}
  .app-title{font-size:23px;font-weight:700}
  .app-sub{font-size:12.5px;color:var(--text-muted);margin-top:6px}
  .lead{font-size:13px;color:var(--text-muted);line-height:1.75;margin:.4rem 2px 1rem}
  .lead b{color:var(--text)}
  .section-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-hint);margin:1.8rem 2px .7rem}
  .section-label span{font-weight:500;letter-spacing:0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
  .row{padding:11px 15px;border-top:1px solid #F1EEE9}
  .row:first-child{border-top:none}
  .note{background:#FAF6EE;border:1px solid #EBDFC7;border-radius:var(--radius);padding:11px 14px;font-size:12.5px;color:#6b5d40;line-height:1.7;margin-bottom:12px}
  .rn{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.6}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* 場面チップ */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
    border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--text-muted)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
  .chip[aria-pressed="true"]{border-color:var(--c);background:var(--cb);color:var(--c)}
  .scene-memo{font-size:12.5px;color:var(--text-muted);line-height:1.7;margin-top:10px}
  .scene-memo b{color:var(--text)}

  /* 入力 */
  textarea{width:100%;min-height:92px;resize:vertical;padding:11px 13px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:#FCFBF8;color:var(--text);font-family:inherit;font-size:15.5px;line-height:1.9}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{padding:8px 18px;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent);
    color:#fff;font-weight:700;font-size:14px}
  .btn.ghost{background:transparent;color:var(--text-muted);border-color:var(--border);font-weight:600}
  .samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .samples b{font-size:11px;color:var(--text-hint);font-weight:700;align-self:center}
  .samples button{font-size:12px;padding:4px 10px;border-radius:20px;border:1px dashed var(--border);
    background:transparent;color:var(--text-muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 結果 */
  .marked{padding:13px 15px;font-size:16px;line-height:2.25;background:#FAF8F4;border-top:1px solid var(--border)}
  mark{padding:1px 3px;border-radius:5px;background:transparent;color:inherit;border-bottom:2px solid}
  mark.bad{background:var(--ng-bg);border-color:#E0B4A4}
  mark.ok,mark.keep{background:var(--ok-bg);border-color:#B9D3A0}
  mark.keep{border-bottom-style:dashed}
  .gauges{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
  .gauge{padding:11px 12px;border-left:1px solid #F1EEE9}
  .gauge:first-child{border-left:none}
  .gauge b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-hint)}
  .gauge .val{font-size:16px;font-weight:700;margin-top:2px}
  .gauge .bar{display:flex;gap:3px;margin-top:5px}
  .gauge .bar s{flex:1;height:5px;border-radius:2px;background:#ECE8E1;text-decoration:none}
  .gauge .bar s.on{background:var(--accent)}
  .gauge small{display:block;font-size:10.5px;color:var(--text-hint);margin-top:4px;line-height:1.5}
  @media (max-width:400px){ .gauges{grid-template-columns:1fr 1fr} .gauge:nth-child(3){grid-column:1/-1;border-left:none;border-top:1px solid #F1EEE9} }
  .verdict{padding:11px 15px;border-top:1px solid var(--border);font-size:12.5px;line-height:1.75}
  .verdict.ng{background:var(--ng-bg);color:#6B3320}
  .verdict.good{background:var(--ok-bg);color:#3B5219}
  .verdict b{font-weight:800}
  .hit{padding:11px 15px;border-top:1px solid #F1EEE9}
  .hit .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hit .tag{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:20px;border:1px solid}
  .tag.bad{color:var(--ng);background:var(--ng-bg);border-color:#E0B4A4}
  .tag.ok{color:var(--ok);background:var(--ok-bg);border-color:#B9D3A0}
  .hit .lay{font-size:10.5px;color:var(--text-hint)}
  .hit .swap{font-size:15px;font-weight:600;margin-top:4px;line-height:1.6}
  .hit .swap .ar{color:var(--text-hint);padding:0 5px}
  .hit .swap .to{color:var(--ok)}
  .hit .n{font-size:10.5px;color:var(--text-hint);font-weight:600}
  .empty{padding:14px 15px;font-size:12.5px;color:var(--text-muted);border-top:1px solid var(--border)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 15px;border-top:1px solid var(--border);
    font-size:10.5px;color:var(--text-hint);background:#FAF8F4}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:14px;height:8px;border-radius:3px;border-bottom:2px solid}
  .legend i.bad{background:var(--ng-bg);border-color:#E0B4A4}
  .legend i.ok{background:var(--ok-bg);border-color:#B9D3A0}

  /* 二軸マップ */
  .plotwrap{padding:14px 40px 30px 26px}
  .plot{position:relative;width:100%;aspect-ratio:1/.78;
    background:repeating-linear-gradient(to right,#F1EEE9 0 1px,transparent 1px 20%),
               repeating-linear-gradient(to bottom,#F1EEE9 0 1px,transparent 1px 20%);
    border-left:1.5px solid var(--border);border-bottom:1.5px solid var(--border)}
  .dot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:0;padding:2px;white-space:nowrap}
  .dot i{display:block;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--surface)}
  .dot span{font-size:10.5px;font-weight:700;color:var(--text-hint)}
  .dot[aria-pressed="true"] i{width:15px;height:15px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--cb)}
  .dot[aria-pressed="true"] span{color:var(--text)}
  .ylab,.xlab{position:absolute;font-size:10px;letter-spacing:.06em;color:var(--text-hint);font-weight:700;white-space:nowrap}
  .ylab{left:-8px;transform:translateX(-100%);writing-mode:vertical-rl}
  .ylab.hi{top:0} .ylab.lo{bottom:0}
  .xlab{bottom:-20px}
  .xlab.lo{left:0} .xlab.hi{right:0}

  /* 例文帳 */
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
  .seg button{padding:6px 13px;border:0;background:transparent;font-size:12.5px;color:var(--text-muted);font-weight:600}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .fn-h{padding:10px 15px;background:#FAF8F4;border-bottom:1px solid var(--border)}
  .fn-h .t{font-size:14px;font-weight:700}
  .fn-h .s{font-size:11.5px;color:var(--text-muted)}
  .line{font-size:15.5px;font-weight:600;line-height:1.75}
  .line.na{font-size:13px;font-weight:500;color:var(--text-hint)}
  .pivot{padding:10px 15px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--text-muted);line-height:1.7}
  .pivot b{color:var(--text)}
  .crow{padding:10px 15px;border-top:1px solid #F1EEE9;border-left:4px solid var(--c)}
  .crow:first-child{border-top:none}
  .crow.cur{background:var(--cb)}
  .crow .who{font-size:10.5px;font-weight:700;color:var(--c);margin-bottom:2px}

  /* 辞典 */
  input[type="search"]{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:8px}
  .fbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .fbtn{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
    color:var(--text-muted);font-weight:600}
  .fbtn[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
  .dw{font-size:14.5px;font-weight:600;line-height:1.6}
  .dw .from{color:var(--ng)}
  .dw .ar{color:var(--text-hint);padding:0 5px}
  .dw .to{color:var(--ok)}
  .dlay{font-size:10.5px;color:var(--text-hint);font-weight:700;margin-bottom:2px}

  .kyoin{margin-top:18px;padding:12px 15px;background:#F6EBF0;border:1px solid #E7D3DE;border-radius:12px;
    font-size:12px;line-height:1.8;color:#6E2A46}
  .kyoin .h{font-weight:800;margin-bottom:3px}
  .kyoin a{color:#8A3A5B;font-weight:700;text-decoration:none}
  .app-footer{text-align:center;font-size:11px;color:var(--text-hint);margin-top:2rem;line-height:1.8}
</style>
</head>
<body>
<div class="container">

  <a href="keigo.html" class="back">‹ 敬語にもどる</a><a href="index.html" class="back">🏠 トップ</a>

  <div class="app-header">
    <div class="app-logo">NIHONGO NO HEYA</div>

    <div class="row">
      <label for="inp" style="position:absolute;left:-9999px">調べたい文</label>
      <textarea id="inp"></textarea>
      <div class="btnrow">
        <button class="btn" id="run">調べる</button>

      <div class="plot" id="plot">
        <span class="ylab hi" id="plotYhi"></span><span class="ylab lo" id="plotYlo"></span>
        <span class="xlab lo" id="plotXlo"></span><span class="xlab hi" id="plotXhi"></span>
      </div>

    <div class="row"><div class="dlay" id="axY"></div><div class="rn" id="axYn" style="margin-top:0"></div></div>

  <div class="kyoin">
    <div class="h" id="kyoinTitle"></div>
    <span id="kyoinBody"></span><a href="kyoin_yogo_isougo.html">位相語</a>・<a href="kyoin_yogo_register.html">レジスター</a>・<a href="kyoin_yogo_taiguu.html">待遇表現</a>・<a href="kyoin_yogo_aizuchi.html">あいづち</a>・<a href="kyoin_yogo_goshu.html">語種</a>

<script src="isou_data.js"></script>
<script>
(function(){
"use strict";

var D = window.ISOU_DATA || {};
var T = D.ui || {};
var STYLES = D.styles || [];
var L = D.lex || [];
var FNS = D.fns || [];
var ORDER = STYLES.map(function(s){ return s.id; });

function S(id){ for(var i=0;i<STYLES.length;i++) if(STYLES[i].id===id) return STYLES[i]; return STYLES[0]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }
function rich(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function txt(id, s){ var el = document.getElementById(id); if(el) el.innerHTML = rich(s); }
function cvars(s){ return "--c:" + s.c + ";--cb:" + s.cb; }

/* ===================== 照合 ===================== */
var INDEX = [];
L.forEach(function(e, ei){
  if(e.ax === "keep"){
    (e.m[0]||[]).forEach(function(w){ INDEX.push({w:w, e:ei, slot:0}); });
    return;
  }
  for(var s=0;s<3;s++){
    (e.m[s]||[]).forEach(function(w){ if(w) INDEX.push({w:w, e:ei, slot:s}); });
  }
});
INDEX.sort(function(a,b){ return b.w.length - a.w.length; });

function scan(text){
  var used = new Array(text.length), hits = [], j, k, ok;
  for(k=0;k<INDEX.length;k++){
    var w = INDEX[k].w, from = 0, at;
    while((at = text.indexOf(w, from)) !== -1){
      ok = true;
      for(j=at;j<at+w.length;j++) if(used[j]){ ok = false; break; }
      if(ok){
        for(j=at;j<at+w.length;j++) used[j] = true;
        hits.push({at:at, len:w.length, w:w, e:INDEX[k].e, slot:INDEX[k].slot});
      }
      from = at + 1;
    }
  }
  hits.sort(function(a,b){ return a.at - b.at; });
  return hits;
}
function pick(v, idx){
  var i;
  for(i=idx;i<3;i++) if(v[i]) return v[i];
  for(i=idx;i>=0;i--) if(v[i]) return v[i];
  return "";
}
function judge(hit, sc){
  var e = L[hit.e];
  if(e.ax === "keep") return {k:"keep", to:"", why:e.why, e:e};
  if(e.w && !sc.w) return {k:"bad", to:pick(e.v, 0), why:e.why, e:e};
  var tier = (e.ax === "t") ? sc.t : sc.h;
  var r = (e.r || [0,0,0])[tier-1];
  var x = (e.x || [2,2,2])[tier-1];
  if(hit.slot < r) return {k:"bad", to:pick(e.v, r), why:e.why, e:e};
  if(hit.slot > x) return {k:"bad", to:pick(e.v, x), why:e.why, e:e};
  return {k:"ok", to:"", why:e.why, e:e};
}
function styleOfSentences(text){
  var parts = text.split(/[。．.!！?？\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
  var polite = 0, plain = 0;
  parts.forEach(function(s){
    var tail = s.replace(/[よねなかわさぞぜっ〜ー～]+$/, "");
    if(/(です|ます|ません|でした|ました|ましょう|ください|ませ|ございます|でしょう)$/.test(tail)) polite++;
    else if(/(だ|だろ|じゃん|かな|る|た|ない|う|い|の)$/.test(tail)) plain++;
  });
  return {n:parts.length, polite:polite, plain:plain};
}

/* ===================== 描画 ===================== */
var cur = STYLES.length ? STYLES[0].id : "", mode = 1, dictFilter = "all";
(function(){ for(var i=0;i<STYLES.length;i++) if(STYLES[i].id === "kokyaku") cur = "kokyaku"; })();

function boot(){
  document.title = T.pageTitle || document.title;
  txt("uiTitle", T.title); txt("uiSub", T.sub); txt("uiLead", T.lead);
  txt("sec1", (T.sec1||"") + ' <span>' + esc(T.sec1en||"") + '</span>');
  txt("sec2", (T.sec2||"") + ' <span>' + esc(T.sec2en||"") + '</span>');
  txt("sec3", (T.sec3||"") + ' <span>' + esc(T.sec3en||"") + '</span>');
  txt("sec4", (T.sec4||"") + ' <span>' + esc(T.sec4en||"") + '</span>');
  txt("sec5", (T.sec5||"") + ' <span>' + esc(T.sec5en||"") + '</span>');
  txt("note2", T.note2); txt("note3", T.note3); txt("note5", T.note5);
  txt("disc", T.disclaimer);
  txt("axY", T.axY); txt("axYn", T.axYn); txt("axX", T.axX); txt("axXn", T.axXn);
  txt("plotYhi", T.plotYhi); txt("plotYlo", T.plotYlo);
  txt("plotXlo", T.plotXlo); txt("plotXhi", T.plotXhi);
  txt("kyoinTitle", T.kyoinTitle); txt("kyoinBody", T.kyoinBody);
  txt("foot1", T.foot1); txt("foot2", T.foot2);
  document.getElementById("run").textContent = T.btnRun || "調べる";
  document.getElementById("clr").textContent = T.btnClear || "消す";
  document.getElementById("m1").textContent = T.mode1 || "";
  document.getElementById("m6").textContent = T.mode6 || "";
  var inp = document.getElementById("inp");
  inp.placeholder = T.inpPlaceholder || "";
  inp.value = T.inpDefault || "";
  document.getElementById("q").placeholder = T.qPlaceholder || "";
  var fl = {all:T.fAll, filler:T.fFiller, kango:T.fKango, written:T.fWritten};
  Array.prototype.forEach.call(document.querySelectorAll(".fbtn"), function(b){
    b.textContent = fl[b.dataset.f] || b.dataset.f;
  });
  var box = document.getElementById("samples");
  box.innerHTML = '<b>' + esc(T.samplesLabel||"例文") + '</b>';
  (T.samples||[]).forEach(function(s){
    var b = document.createElement("button");
    b.textContent = s.length > 16 ? s.slice(0,16) + "…" : s;
    b.title = s;
    b.addEventListener("click", function(){ inp.value = s; analyze(); });
    box.appendChild(b);
  });
}

function buildScene(){
  var c = document.getElementById("chips"), plot = document.getElementById("plot");
  c.innerHTML = "";
  STYLES.forEach(function(s){
    var b = document.createElement("button");
    b.className = "chip"; b.style.cssText = cvars(s); b.dataset.id = s.id;
    b.setAttribute("aria-pressed", s.id===cur?"true":"false");
    b.innerHTML = '<i></i>' + esc(s.label);
    b.addEventListener("click", function(){ select(s.id); });
    c.appendChild(b);

    var d = document.createElement("button");
    d.className = "dot"; d.style.cssText = cvars(s) + ";left:" + s.x + "%;top:" + (100 - s.y) + "%";
    d.dataset.id = s.id;
    d.setAttribute("aria-pressed", s.id===cur?"true":"false");
    d.innerHTML = '<i></i><span>' + esc(s.short || s.label) + '</span>';
    d.addEventListener("click", function(){ select(s.id); });
    plot.appendChild(d);
  });
}
function renderSceneMemo(){
  var s = S(cur);
  document.getElementById("sceneMemo").innerHTML = '<b>' + esc(s.who) + '</b><br>' + rich(s.memo);
}
function bar(n){ var o=""; for(var i=1;i<=3;i++) o += '<s class="' + (i<=n?"on":"") + '"></s>'; return o; }

function analyze(){
  var text = document.getElementById("inp").value;
  var res = document.getElementById("res");
  if(!text.trim()){ res.innerHTML = '<div class="empty">' + esc(T.emptyInput||"") + '</div>'; return; }
  var sc = S(cur), hits = scan(text), out = [], html = "", last = 0;

  hits.forEach(function(h){
    var j = judge(h, sc);
    out.push({h:h, j:j});
    html += esc(text.slice(last, h.at));
    html += '<mark class="' + j.k + '">' + esc(h.w) + '</mark>';
    last = h.at + h.len;
  });
  html += esc(text.slice(last));
  html = html.replace(/\n/g, "<br>");

  var cw = [], fw = [];
  out.forEach(function(o){
    if(o.j.e.ax === "h") cw.push(o.h.slot);
    else if(o.j.e.ax === "t") fw.push(o.h.slot);
  });
  function avg(a){ if(!a.length) return null; var s=0; a.forEach(function(v){s+=v;}); return s/a.length; }
  function lvl(a){ return a === null ? null : (a >= 1.5 ? 3 : (a >= 0.7 ? 2 : 1)); }
  function word(n){ return n === null ? "—" : (n === 3 ? "硬" : (n === 2 ? "中" : "柔")); }
  var cl = lvl(avg(cw)), fl = lvl(avg(fw));
  var st = styleOfSentences(text);
  var fend = st.polite && st.plain ? "混在" : (st.polite ? "丁寧体" : (st.plain ? "普通体" : "—"));

  var g = '<div class="gauges">' +
    '<div class="gauge"><b>' + esc(T.gContent||"") + '</b><div class="val">' + word(cl) + '</div><div class="bar">' + bar(cl||0) + '</div>' +
      '<small>' + esc(T.gContentNote||"") + '</small></div>' +
    '<div class="gauge"><b>' + esc(T.gFunc||"") + '</b><div class="val">' + word(fl) + '</div><div class="bar">' + bar(fl||0) + '</div>' +
      '<small>' + esc(T.gFuncNote||"") + '</small></div>' +
    '<div class="gauge"><b>' + esc(T.gEnd||"") + '</b><div class="val">' + esc(fend) + '</div>' +
      '<small>' + (st.n ? esc(st.n + "文　丁寧" + st.polite + "／普通" + st.plain) : "") + '</small></div>' +
  '</div>';

  var v = "";
  if(cl === 3 && fl === 1) v = '<div class="verdict ng">' + rich(T.vChiguhagu||"") + '</div>';
  else if(fend === "混在") v = '<div class="verdict ng">' + rich(T.vMixed||"") + '</div>';
  else if(cl !== null && fl !== null && cl === fl) v = '<div class="verdict good">' + rich(T.vOk||"") + '</div>';

  var rank = {bad:0, keep:1, ok:2}, seen = {}, list = [];
  out.forEach(function(o){
    var key = o.h.e + "|" + o.h.w + "|" + o.j.k;
    if(seen[key]){ seen[key].n++; return; }
    o.n = 1; seen[key] = o; list.push(o);
  });
  list.sort(function(a,b){ return rank[a.j.k] - rank[b.j.k]; });

  var hitHtml = "";
  if(!list.length){
    hitHtml = '<div class="empty">' + esc(T.emptyHit||"") + '</div>';
  } else {
    list.forEach(function(o){
      var j = o.j, tag = j.k === "bad" ? "bad" : "ok",
        lab = j.k === "keep" ? (T.labKeep||"") : (j.k === "bad" ? (T.labFix||"") : (T.labAsIs||""));
      hitHtml += '<div class="hit"><div class="head">' +
        '<span class="tag ' + tag + '">' + esc(lab) + '</span>' +
        '<span class="lay">' + esc(j.e.lay) + '</span>' +
        (o.n > 1 ? '<span class="n">' + o.n + '回</span>' : '') + '</div>' +
        '<div class="swap">' + esc(o.h.w) +
        (j.to ? '<span class="ar">→</span><span class="to">' + esc(j.to) + '</span>' : '') + '</div>' +
        '<div class="rn">' + rich(j.why) + '</div></div>';
    });
  }

  res.innerHTML = '<div class="marked">' + html + '</div>' + g + v + hitHtml +
    '<div class="legend">' +
      '<span><i class="bad"></i>' + esc(T.legendBad||"") + '</span>' +
      '<span><i class="ok"></i>' + esc(T.legendOk||"") + '</span>' +
      '<span>「' + esc(S(cur).label) + '」として見ています</span>' +
    '</div>';
}

function cellHTML(v){
  if(!v) return '<div class="line na">—</div>';
  if(v.na) return '<div class="line na">' + esc(T.naText||"") + '</div>' + (v.n?'<div class="rn">'+rich(v.n)+'</div>':'');
  return '<div class="line">' + esc(v.t) + '</div>' + (v.n?'<div class="rn">'+rich(v.n)+'</div>':'');
}
function renderFns(){
  var html = "";
  FNS.forEach(function(f){
    html += '<div class="card"><div class="fn-h"><div class="t">' + esc(f.fn) + '</div><div class="s">' + esc(f.sit) + '</div></div>';
    if(mode===1){
      html += '<div class="row">' + cellHTML(f.v[cur]) + '</div>';
    } else {
      ORDER.forEach(function(id){
        var st = S(id);
        html += '<div class="crow' + (id===cur?" cur":"") + '" style="' + cvars(st) + '">' +
          '<div class="who">' + esc(st.label) + '</div>' + cellHTML(f.v[id]) + '</div>';
      });
    }
    html += '<div class="pivot"><b>' + esc(T.pivotLabel||"") + '　</b>' + rich(f.pivot) + '</div></div>';
  });
  document.getElementById("fnList").innerHTML = html;
}

function dictRows(){
  return L.map(function(e){
    var a, b, kind = e.g === "敬語" ? "filler" : e.g;
    if(e.ax === "keep"){ a = e.v[0]; b = T.keepLabel || ""; }
    else if(e.g === "written" || (e.ax === "h" && e.m[2] && e.m[2].length && !e.ok && e.v[0] !== e.v[2])){ a = e.v[2]; b = e.v[0]; }
    else if(e.ax === "h" && e.r && e.r[2] === 2){ a = e.v[0]; b = e.v[2]; }
    else { a = e.v[0]; b = e.v[2] || e.v[1]; }
    return {a:a, b:b, kind:kind, lay:e.lay, why:e.why};
  }).filter(function(r){ return r.a; });
}
var DICT = [];
function renderDict(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var rows = DICT.filter(function(r){
    if(dictFilter !== "all" && r.kind !== dictFilter) return false;
    if(!q) return true;
    return (r.a + r.b + r.why + r.lay).toLowerCase().indexOf(q) !== -1;
  });
  document.getElementById("dict").innerHTML = rows.length ? rows.map(function(r){
    return '<div class="row"><div class="dlay">' + esc(r.lay) + '</div>' +
      '<div class="dw"><span class="from">' + esc(r.a) + '</span><span class="ar">→</span><span class="to">' + esc(r.b) + '</span></div>' +
      '<div class="rn">' + rich(r.why) + '</div></div>';
  }).join("") : '<div class="empty" style="border-top:none">' + esc(T.dictEmpty||"") + '</div>';
}

function select(id){
  cur = id;
  var n = document.querySelectorAll(".chip"), i;
  for(i=0;i<n.length;i++) n[i].setAttribute("aria-pressed", n[i].dataset.id===id?"true":"false");
  n = document.querySelectorAll(".dot");
  for(i=0;i<n.length;i++) n[i].setAttribute("aria-pressed", n[i].dataset.id===id?"true":"false");
  renderSceneMemo();
  renderFns();
  if(document.getElementById("res").innerHTML.trim()) analyze();
}

if(!STYLES.length || !L.length){
  document.getElementById("res").innerHTML =
    '<div class="empty">データファイル（isou_data.js）が読み込めませんでした。同じフォルダにあるか確かめてください。</div>';
} else {
  boot();
  buildScene();
  renderSceneMemo();
  renderFns();
  DICT = dictRows();
  renderDict();
  analyze();
}

document.getElementById("run").addEventListener("click", analyze);
document.getElementById("clr").addEventListener("click", function(){
  document.getElementById("inp").value = "";
  document.getElementById("res").innerHTML = '<div class="empty">' + esc(T.emptyInput||"") + '</div>';
  document.getElementById("inp").focus();
});
document.getElementById("inp").addEventListener("keydown", function(ev){
  if((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") analyze();
});
document.getElementById("m1").addEventListener("click", function(){
  mode = 1; this.setAttribute("aria-pressed","true");
  document.getElementById("m6").setAttribute("aria-pressed","false"); renderFns();
});
document.getElementById("m6").addEventListener("click", function(){
  mode = 6; this.setAttribute("aria-pressed","true");
  document.getElementById("m1").setAttribute("aria-pressed","false"); renderFns();
});
document.getElementById("q").addEventListener("input", renderDict);
Array.prototype.forEach.call(document.querySelectorAll(".fbtn"), function(b){
  b.addEventListener("click", function(){
    dictFilter = b.dataset.f;
    Array.prototype.forEach.call(document.querySelectorAll(".fbtn"), function(o){
      o.setAttribute("aria-pressed", o === b ? "true" : "false");
    });
    renderDict();
  });
});

})();
</script>
</body>
</html>

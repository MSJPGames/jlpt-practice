ょうか。"},{"speaker":"M","text":"そちらも調べましたが、乗り換えたという声はまだ少数でした。減っているのは、これまで毎日使ってくださっていた方なんです。"},{"speaker":"F","text":"毎日使う方が離れているんですか。それは気になりますね。何かきっかけになりそうな変更はありましたか。"},{"speaker":"M","text":"二月の更新で、起動してすぐ出ていたお知らせの画面を、開くのに二回押す形に変えました。あれ以降、毎日使う方の数がきれいに落ちています。"},{"speaker":"N","text":"男の人は、利用者が減った原因は何だと言っていますか。"}]},"N1-L-0069@1":{"uid":"N1-L-0069","revision":1,"audio":"audio/n1_q2_15.mp3","script":[{"speaker":"N","text":"家で、女の人と男の人が話しています。子どもが部活をやめる理由は何ですか。"},{"speaker":"F","text":"あの子、結局、部活をやめるって言い出したの。昨日、ゆっくり話を聞いてみたんだけど。"},{"speaker":"M","text":"そうか。去年のけがのことが、まだ心配なのかな。走るのがつらいなら、無理はさせられないな。"},{"speaker":"F","text":"けがは治ったって本人も言ってる。走るのも問題ないみたい。塾のほうも、今のままでいいって。"},{"speaker":"M","text":"両立がきついわけでもないのか。三年になるし、勉強を優先したいのかと思ったんだけどな。じゃあ、何なんだ。"},{"speaker":"F","text":"去年から練習の方針が変わって、記録を伸ばすことばかりになったんだって。今の部活は自分の居場所じゃないって言うの。"},{"speaker":"M","text":"ああ、あの子はみんなで作る雰囲気が好きで入ったんだったな。それなら、無理に続けさせても仕方ないか。"},{"speaker":"N","text":"子どもが部活をやめる理由は何ですか。"}]},"N1-L-0070@1":{"uid":"N1-L-0070","revision":1,"audio":"audio/n1_q2_16.mp3","script":[{"speaker":"N","text":"市の生涯学習センターで、男の人と女の人が話しています。女の人は、申し込みが増えた一番の理由は何だと言っていますか。"},{"speaker":"M","text":"中村さん、この春の日本語ボランティア講座、定員の倍の申し込みがあったそうですね。何か手を打たれたんですか。"},{"speaker":"F","text":"おかげさまで。私も驚いているんです。広報紙のおかげかと言われるんですが、載せた面積は去年とほとんど同じなんですよ。"},{"speaker":"M","text":"そうなんですか。では、受講料を下げられたとか。このご時世、料金が安くなれば人は動きますからね。"},{"speaker":"F","text":"料金も据え置きです。思い当たるのは、今年から夜の回を作ったことですね。去年までは平日の昼だけでしたから。"},{"speaker":"M","text":"なるほど。昼だけとなると、申し込めるのは時間に余裕のある方に限られてしまいますね。"},{"speaker":"F","text":"そうなんです。今年は夜の回に、お勤めの方が一気に来られまして。定員を増やしたわけではないので、うれしい悲鳴です。"},{"speaker":"N","text":"女の人は、申し込みが増えた一番の理由は何だと言っていますか。"}]},"N1-L-0071@2":{"uid":"N1-L-0071","revision":2,"audio":"audio/n1_q2_17.mp3","script":[{"speaker":"N","text":"女の人と男の人が電話で話しています。修理を受けられないのは、どうしてですか。"},{"speaker":"F","text":"先日お預かりしたお時計ですが、申し訳ありません、修理をお受けできないというご連絡でして。"},{"speaker":"M","text":"え、そんなに壊れていましたか。落としたわけでもないので、そこまでひどいとは思わなかったんですが。"},{"speaker":"F","text":"いえ、壊れ方自体は、当店でよくお受けする範囲のものです。同じ部品の製造は終わっておりますが、似たも 、うちもまだいいか、となる。ですから私は、誰が誰に声をかけるかを、あらかじめ決めておいてくださいとお願いしています。物をそろえることより、動き出す合図を持つこと。今日はその話をさせていただきます。"},{"speaker":"N","text":"男の人は何について話していますか。"},{"speaker":"N","text":"いち、備えの品の種類と量","choice":1},{"speaker":"N","text":"に、逃げる合図を持つこと","choice":2},{"speaker":"N","text":"さん、消防で働いた三十年間","choice":3},{"speaker":"N","text":"よん、道が水に浸かる時刻","choice":4}]},"N1-L-0115@2":{"uid":"N1-L-0115","revision":2,"audio":"audio/course2026_n1_L0115_v2.mp3","script":[{"speaker":"N","text":"講演会で、女の医師が話しています。"},{"speaker":"F","text":"患者さんに十分に説明し、選んでいただく。今ではどの病院でも当たり前になりました。私自身、そのために資料を作り、時間をかけてきました。ただ、最近になって、少し立ち止まっています。選択肢を並べて、どれになさいますかと尋ねると、多くの方が黙ってしまわれる。医学の言葉で説明を受けた直後に、自分の人生を左右する判断をせよというのは、考えてみればずいぶん酷な話です。説明を尽くしたのだから後はご本人の責任だ、というのでは、こちらが楽をしているだけではないか。私は、選んでもらうことと、一緒に迷うことは違うと思うのです。分からないという言葉を受け止めて、そこから話し始める。それが説明の続きだと考えています。"},{"speaker":"N","text":"女の医師はどのような考えを述べていますか。"},{"speaker":"N","text":"いち、選択肢を示せば十分","choice":1},{"speaker":"N","text":"に、説明を尽くせば足りる","choice":2},{"speaker":"N","text":"さん、一緒に迷うのが説明だ","choice":3},{"speaker":"N","text":"よん、説明の時間を長くする","choice":4}]},"N1-L-0116@2":{"uid":"N1-L-0116","revision":2,"audio":"audio/n1_q3_22.mp3","script":[{"speaker":"N","text":"落語の稽古場で、男の人が話しています。"},{"speaker":"M","text":"今日は、あたしのしくじりの話をするよ。この道に入って二年目の夏だ。初めて大きな寄席に出してもらってね。前に出た人がよく受けてたもんだから、負けたくないと思って、本題に入る前の世間話をどんどん長くした。客席はよく笑ったよ。気持ちがよかった。さあ本題だという時になって、舞台のわきから、そろそろ下りろという紙が出た。本題をひとくだりしゃべって、下りたんだ。あれから、あたしはきまりを一つ決めてる。世間話で笑いをもらうのは二度まで。三度目が来そうになったら、受けてようが受けてまいが、その場で本題に入る。おかげで、それからは持ち時間を越えたことがない。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、笑いは二度までで切る","choice":1},{"speaker":"N","text":"に、前の人より長く話す","choice":2},{"speaker":"N","text":"さん、受けるかぎり話を続ける","choice":3},{"speaker":"N","text":"よん、本題は短く切り上げる","choice":4}]},"N1-L-0117@1":{"uid":"N1-L-0117","revision":1,"audio":"audio/n1_q3_23.mp3","script":[{"speaker":"N","text":"保健所の講習会で、女の人が話しています。"},{"speaker":"F","text":"店をまわっていて、ずっと考えてきたことがあります。手を洗ってくださいと申し上げても、なぜ続かないのか。同じことを仲間に聞きますと、返ってくる答えはだいたい二つです。大事さが伝わっていないから。もう一つは、忙しくてそれどころではないから。ですが、講習を受けた店の方に伺いますと、大事さはよく覚えていらっしゃいました。客の少ない時間帯に私どもが見ておりましても、洗う回数はさほど増えません。そこで私は、調理場の中を歩き回ってみました。すると、気づいたことがあります。洗い場が、調理する人の後ろ側にあるのです。振り向いて、体ごと下がらないと届きません。手が汚れたその場で洗える店では、申し上げなくても洗っておられました。足りないのは、知識でも余裕でもありません。洗い場までの近さです。"},{"speaker":"N","text":"女の人は、何を問題だと考えていますか。"},{"speaker":"N","text":"いち、洗い場が遠すぎること","choice":1},{"speaker":"N","text":"に、洗い場の数が足りない","choice":2},{"speaker":"N","text":"さん、大事さが伝わらない","choice":3},{"speaker":"N","text":"よん、忙しくて余裕がない","choice":4}]},"N1-L-0118@1":{"uid":"N1-L-0118","revision":1,"audio":"audio/n1_q3_24.mp3","script":[{"speaker":"N","text":"講演会で、男の翻訳家が話しています。"},{"speaker":"M","text":"機械で訳せる時代に、人が訳す意味はあるのか。よく聞かれます。実務の文章であれば、正直、機械のほうが速いですし、疲れも知りません。ただ、私が仕事で最も時間をかけているのは、訳語を選ぶところではないのです。この一文は、もとの読者にとってどれくらい珍しい言い方だったのか。当たり前の言い方を当たり前に訳すのか、引っかかる言い方を引っかかるまま残すのか。そこを決めるには、二つの言葉の世界で、それぞれ何が普通とされているかを知っていなければなりません。訳すというのは、言葉を置き換える作業ではなく、二つの社会の間で、どこに驚きを置くかを決める作業なのです。今日はその話をいたします。"},{"speaker":"N","text":"男の人は何について話していますか。"},{"speaker":"N","text":"いち、驚きの置き所を決める","choice":1},{"speaker":"N","text":"に、機械の翻訳の速さ","choice":2},{"speaker":"N","text":"さん、実務の文章を訳す注意","choice":3},{"speaker":"N","text":"よん、珍しい言い方の見分け方","choice":4}]},"N1-L-0119@1":{"uid":"N1-L-0119","revision":1,"audio":"audio/n1_q3_25.mp3","script":[{"speaker":"N","text":"会議で、女の人が話しています。"},{"speaker":"F","text":"残業を減らそうという方針が出て、二年になります。数字の上では確かに減りました。ただ、現場を回ってみますと、家に持ち帰る人が増えただけ、という部署もございます。これでは何のための取り組みか分かりません。時間を短くすること自体を目標にしてしまったのが、そもそもの誤りだったと思うのです。仕事の量が同じままなら、時間を削れば、どこかにしわ寄せが行くのは当たり前です。まず減らすべきは、時間ではなく仕事のほうでしょう。誰も読んでいない報告書、出席者の八割が黙っている会議。そういうものを一つずつ止めていく。手間はかかりますが、そこを飛ばして時間だけを縛れば、また同じことの繰り返しになります。"},{"speaker":"N","text":"女の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、先に減らす仕事の量","choice":1},{"speaker":"N","text":"に、数字の上で減った残業","choice":2},{"speaker":"N","text":"さん、家に持ち帰る仕事","choice":3},{"speaker":"N","text":"よん、誰も読まない報告書","choice":4}]},"N1-L-0120@1":{"uid":"N1-L-0120","revision":1,"audio":"audio/n1_q3_26.mp3","script":[{"speaker":"N","text":"商工会の集まりで、女の人が男の会長に話を聞いています。"},{"speaker":"F","text":"今年は催しを減らす案があると伺いましたが。"},{"speaker":"M","text":"ええ。うちの会で続けてきた催しは三つあります。春の売り出し、夏の福引き、秋の食べ歩き。どれも先輩方が始めたもので、やめようとは言い出しにくい。ただね、去年の記録を見ると、催しの前の日と当日、店を閉めていた会員が半数を超えてるんです。人を呼ぶための催しのために、店が閉まってる。それで今日は、思い切った案を持ってきました。春の売り出しと夏の福引きはやめて、秋の食べ歩きだけ残す。二つやめれば、その手間を日ごろ店を開けておくほうにまわせます。寂しくなるという声は出るでしょう。それでも私は、減らすほうを選びたい。"},{"speaker":"N","text":"男の会長が最も言いたいことは何ですか。"},{"speaker":"N","text":"いち、催しの日は店を閉める","choice":1},{"speaker":"N","text":"に、三つの催しを続ける","choice":2},{"speaker":"N","text":"さん、新しい催しを増やす","choice":3},{"speaker":"N","text":"よん、二つやめて店を開ける","choice":4}]},"N1-L-0121@1":{"uid":"N1-L-0121","revision":1,"audio":"audio/n1_q3_27.mp3","script":[{"speaker":"N","text":"講演会で、女の人が話しています。"},{"speaker":"F","text":"写真も書類も、今はほとんどが電子の形で残ります。場所を取らず、いくらでも複製できる。だから記録は安泰だと思われがちですが、私はむしろ危ういと感じています。紙は、放っておいても百年は読めます。電子の記録は、それを読む仕組みが失われた時点で、中身が無事であっても取り出せません。実際、二十年前の調査の記録が、当時の機械でしか開けず、何が書いてあるのか分からなくなった例を、いくつも見てきました。しかも、量が多いために、何を残すかを誰も決めていない。全部あるということは、どれも選ばれていないということでもあります。今日は、残すとはどういうことかを、量ではなく選ぶ側から考えてみたいと思います。"},{"speaker":"N","text":"女の人は何について話していますか。"},{"speaker":"N","text":"いち、記録の危うさと選び方","choice":1},{"speaker":"N","text":"に、複製できることの利点","choice":2},{"speaker":"N","text":"さん、昔の機械で開けない例","choice":3},{"speaker":"N","text":"よん、紙の記録を残す方法","choice":4}]},"N1-L-0122@1":{"uid":"N1-L-0122","revision":1,"audio":"audio/n1_q3_28.mp3","script":[{"speaker":"N","text":"ラジオで、男の人が話しています。"},{"speaker":"M","text":"農業をやる人が減っている、後継ぎがいない。そう聞くと、若い人が土に触れなくなったからだと考えがちです。ですが、私の周りには、やってみたいという人がずいぶんいます。問題は、始められないことのほうなんです。田畑を借りようとしても、貸す側は、途中でやめられては困ると考えて、なかなか首を縦に振らない。機械を一式そろえれば、車が何台も買える額になります。つまり、入り口がずいぶん高いところにある。この十年、私は近所の何軒かと、機械を共同で持つ形を試してきました。うまくいくときばかりではありませんが、少なくとも、始めたいと言った人が三人、今も続けています。減った理由を嘆くより、入り口を低くすることに手を尽くすべきだと思っています。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、農業の入り口を低くする","choice":1},{"speaker":"N","text":"に、土に触れない若い人","choice":2},{"speaker":"N","text":"さん、機械を一式そろえる費用","choice":3},{"speaker":"N","text":"よん、共同で機械を持つ試み","choice":4}]},"N1-L-0123@2":{"uid":"N1-L-0123","revision":2,"audio":"audio/n1_q3_29.mp3","script":[{"speaker":"N","text":"大学の講義で、女の先生が話しています。"},{"speaker":"F","text":"名前を隠して書き込めるから、ひどい言葉が飛び交うのだ。だから実名にすればよい。よく耳にする主張です。たしかに、名前が出れば書きにくくなるという面はあるでしょう。しかし、匿名だから乱暴になるという説明では、うまく説き明かせないことがいくつもあります。名前を出したまま人を攻撃する例はいくらでもありますし、逆に、匿名だからこそ、誰にも言えなかった被害を打ち明けられた人もいる。私が注目しているのは、名前の有無ではなく、その言葉が誰に届くと本人が思っているか、という点です。仲間内に向けたつもりの言葉が、見知らぬ人の前に投げ出される。この、届く先の見えなさこそが、問題の中心にあると考えています。"},{"speaker":"N","text":"女の先生はどのような考えを述べていますか。"},{"speaker":"N","text":"いち、実名にすれば解決する","choice":1},{"speaker":"N","text":"に、届く先が見えないこと","choice":2},{"speaker":"N","text":"さん、匿名だから乱暴になる","choice":3},{"speaker":"N","text":"よん、匿名は被害者に必要だ","choice":4}]},"N1-L-0124@1":{"uid":"N1-L-0124","revision":1,"audio":"audio/n1_q3_30.mp3","script":[{"speaker":"N","text":"校正の勉強会で、女の人が話しています。"},{"speaker":"F","text":"校正というのは、刷る前の原稿を読んで、まちがいを見つける仕事です。人に説明するときは、いつも鍋の味見にたとえております。作っている人は、初めから終わりまでその鍋のそばにいますから、味に慣れてしまいます。塩を入れすぎたことにも、だんだん気づかなくなる。そこで、途中から入ってきた者が、一口だけもらうのです。味見をする者は、勝手に塩を足したりはしません。しょっぱいようです、と伝えるところまでが役目です。私たちの仕事も同じです。見つけた食いちがいは、書き手に伝えます。原稿は、書き手の手を離れるまで、こちらと何度も行き来します。直すかどうかを決めるのは書き手のほうで、私たちが赤で直しきってしまえば、その原稿は誰のものでもなくなります。"},{"speaker":"N","text":"女の人は何について話していますか。"},{"speaker":"N","text":"いち、まちがいを見つける力","choice":1},{"speaker":"N","text":"に、校正をする者の役目","choice":2},{"speaker":"N","text":"さん、原稿が行き来する回数","choice":3},{"speaker":"N","text":"よん、直しを伝える言い方","choice":4}]},"N1-L-0125@2":{"uid":"N1-L-0125","revision":2,"audio":"audio/course2026_n1_L0125_v2.mp3","script":[{"speaker":"N","text":"テレビの料理番組で、男の料理人が話しています。"},{"speaker":"M","text":"旬のものを使えばおいしくなる、とよく言われます。確かにそのとおりで、春先のたけのこや、寒さが来てからの大根は、下手に手を加えないほうがいい。いい材料が入った日は、私も包丁を入れる回数を減らしますし、味つけもごく薄くします。"},{"speaker":"M","text":"ただ、店を開けている以上、そういう日ばかりではありません。雨が続けば、水っぽい野菜しか届かない日もあります。そんな日に、いつもと変わらない一皿を出せるかどうかで、店の値打ちは決まると思っています。だしを濃くするのか、火の入れ方を変えるのか、手はいくつもあります。若い者を見るときに、私が見ているのは、そういう日に何をどう組み立てたか、その一点です。"},{"speaker":"N","text":"男の料理人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、旬の材料の生かし方","choice":1},{"speaker":"N","text":"に、条件の悪い日の工夫","choice":2},{"speaker":"N","text":"さん、包丁を入れる回数","choice":3},{"speaker":"N","text":"よん、水っぽい野菜の選び方","choice":4}]},"N1-L-0126@1":{"uid":"N1-L-0126","revision":1,"audio":"audio/n1_q3_32.mp3","script":[{"speaker":"N","text":"講演会で女の人が話しています。女の人は主に何について話していますか。"},{"speaker":"F","text":"私は長年、企業で人材の採用に携わってきました。「優秀な人を採れば組織はうまくいく」。多くの経営者がそう考えます。でも、私の経験では、そう単純ではないんです。どんなに能力の高い人を集めても、その力を発揮できる場がなければ、宝の持ち腐れになる。逆に、ごく普通の人たちでも、互いに補い合える仕組みがあれば、驚くような成果を出す。つまり、大事なのは、誰を採るかと同じくらい、採った人がどう働けるか、その環境をどう作るか、なんですね。"},{"speaker":"N","text":"女の人は主に何について話していますか。"},{"speaker":"N","text":"いち、優秀な人を選ぶ方法","choice":1},{"speaker":"N","text":"に、人を活かす環境作り","choice":2},{"speaker":"N","text":"さん、成果を出す働き方","choice":3},{"speaker":"N","text":"よん、経営者に要る能力","choice":4}]},"N1-L-0127@1":{"uid":"N1-L-0127","revision":1,"audio":"audio/n1_q3_33.mp3","script":[{"speaker":"N","text":"大学の講義で先生が話しています。先生は何について話していますか。"},{"speaker":"M","text":"歴史を学ぶ意味は何か。よく「過去の失敗から教訓を得るため」と言われます。もちろんそれもあります。しかし、私はもう一つ、大切なことがあると思う。それは、今、私たちが当たり前だと思っている常識が、実は、ある時代の、ある条件のもとでたまたま生まれたものにすぎない、と気づくことです。昔の人の考え方を知ると、自分たちの「当たり前」が、絶対ではないと分かる。歴史とは、過去の話であると同時に、今の自分を映す鏡でもあるのです。"},{"speaker":"N","text":"先生は何について話していますか。"},{"speaker":"N","text":"いち、歴史の研究の進め方","choice":1},{"speaker":"N","text":"に、教訓を得るための方法","choice":2},{"speaker":"N","text":"さん、常識を映す鏡の役目","choice":3},{"speaker":"N","text":"よん、昔の人の暮らしぶり","choice":4}]},"N1-L-0128@1":{"uid":"N1-L-0128","revision":1,"audio":"audio/n1_q3_34.mp3","script":[{"speaker":"N","text":"テレビで男の人が話しています。男の人は何について話していますか。"},{"speaker":"M","text":"私は建築の設計をしています。よく「使いやすい家を作ってほしい」と言われます。ところが、いざ暮らし始めると、当初の希望通りに作った部屋が、まったく使われないことがある。なぜか。人は、自分が本当にどう暮らしたいか、案外分かっていないものなんです。だから私は、要望をそのまま形にはしません。その方が、朝どう過ごし、休日は何をするか、生活そのものをじっくり聞く。言葉になっていない暮らし方を読み取る。それこそが、設計の一番大事な仕事だと思っています。"},{"speaker":"N","text":"男の人は何について話していますか。"},{"speaker":"N","text":"いち、言葉にない暮らしを読む","choice":1},{"speaker":"N","text":"に、使いやすい家に要る設備","choice":2},{"speaker":"N","text":"さん、要望を正しく伝える力","choice":3},{"speaker":"N","text":"よん、建築家に要る専門知識","choice":4}]},"N1-L-0129@2":{"uid":"N1-L-0129","revision":2,"audio":"audio/n1_q3_35.mp3","script":[{"speaker":"N","text":"会議で男の人が話しています。男の人は主に何を伝えようとしていますか。"},{"speaker":"M","text":"今期、売上が伸び悩んでいます。原因を、景気のせいだ、他社が安売りしているせいだ、と外に求めるのは簡単です。しかし、それを言っていても何も変わらない。私が皆さんに考えてほしいのは、では、そういう厳しい状況の中で、うちにしかできないことは何か、ということです。同じ環境でも、伸びている会社はある。違いは、環境を言い訳にするか、その中で工夫するか、それだけです。まずは、自分たちにできることから、洗い出していきましょう。"},{"speaker":"N","text":"男の人は主に何を伝えようとしていますか。"},{"speaker":"N","text":"いち、他社の安売りへの対抗","choice":1},{"speaker":"N","text":"に、今期の売上目標の額","choice":2},{"speaker":"N","text":"さん、自分たちにできる工夫","choice":3},{"speaker":"N","text":"よん、伸び悩みは景気のせい","choice":4}]},"N1-L-0130@2":{"uid":"N1-L-0130","revision":2,"audio":"audio/course2026_n1_L0130_v2.mp3","script":[{"speaker":"N","text":"合唱団の練習で、女の指揮者が話しています。"},{"speaker":"F","text":"先週の発表会のあと、そろっていて気持ちがよかった、と何人もの方から声をかけていただきました。ありがたいのですが、そう言われるたびに、私は少し落ち着かない気持ちになります。声をそろえるというのは、全員が同じ大きさ、同じ長さに切りそろえて歌うことだと受け取られやすいのです。実際、それだけを目指した練習をすると、音は整うのに、歌はのっぺりとしてしまいます。"},{"speaker":"F","text":"私がそろうと呼んでいるのは、隣の人が息を吸う音まで聞こえていて、この先どこへ向かうつもりなのかが互いに分かっている、そういう状態です。ですから練習の大半は、聞く耳をつくるための時間に当てています。皆さんの耳が育てば、私の腕の振りは、ほとんど要らなくなるはずです。"},{"speaker":"N","text":"女の指揮者は主に何について話していますか。"},{"speaker":"N","text":"いち、指揮の腕を上げる方法","choice":1},{"speaker":"N","text":"に、同じ大きさでそろえる","choice":2},{"speaker":"N","text":"さん、互いの息が聞こえる状態","choice":3},{"speaker":"N","text":"よん、発表会で褒められた喜び","choice":4}]},"N1-L-0131@2":{"uid":"N1-L-0131","revision":2,"audio":"audio/course2026_n1_L0131_v2.mp3","script":[{"speaker":"N","text":"町内会の集まりで、男の配達員が話しています。"},{"speaker":"M","text":"郵便が前より遅くなった、とお叱りを受けることがあります。人が足りないからだろう、とおっしゃる方が多いのですが、私どもが一日のうちで一番時間を取られているのは、走っている間ではありません。立ち止まって、家を探している間なのです。この十年に建ったお宅は、門柱がなく、表札を玄関の戸の横に小さく付けてあることが多い。番地の札も、庭木の陰に入っております。道からは読めませんので、一軒ごとに敷地へ入って確かめることになります。一日に三百軒回れば、それだけで一時間近くになる計算です。ですから、人を増やしていただく前に、皆さまにお願いしたいことがございます。番地の札を一つ、道を歩く者の目の高さに出しておいていただけないでしょうか。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、番地の札を道から見せる","choice":1},{"speaker":"N","text":"に、庭木を切って道を広げる","choice":2},{"speaker":"N","text":"さん、配達する人を増やすこと","choice":3},{"speaker":"N","text":"よん、表札を大きく作り直す","choice":4}]},"N1-L-0132@1":{"uid":"N1-L-0132","revision":1,"audio":"audio/n1_q3_38.mp3","script":[{"speaker":"N","text":"シンポジウムで研究者が話しています。研究者は何について話していますか。"},{"speaker":"F","text":"科学を分かりやすく伝えることの大切さが、盛んに言われるようになりました。私自身、その必要は大いに認めます。ただ、分かりやすさを求めるあまり、話がいつのまにか言い切りの形になってしまうきらいがある。この物質は体にいい、この方法なら必ず防げる、というように。"},{"speaker":"F","text":"しかし、研究の現場にいる者から見れば、どんな結論にも必ず幅があり、条件がついています。その幅を削り落とした説明は、確かに耳に入りやすい。ですが、あとになって話が変わったとき、人々は科学そのものを信用しなくなる。分からないことは分からないと申し上げる。遠回りに見えても、それが信頼を保つ唯一の道なのです。"},{"speaker":"N","text":"研究者は何について話していますか。"},{"speaker":"N","text":"いち、研究の結論につく幅","choice":1},{"speaker":"N","text":"に、人前で話す機会の多さ","choice":2},{"speaker":"N","text":"さん、分からないと言う姿勢","choice":3},{"speaker":"N","text":"よん、分かりやすく言い切る","choice":4}]},"N1-L-0133@1":{"uid":"N1-L-0133","revision":1,"audio":"audio/n1_q3_39.mp3","script":[{"speaker":"N","text":"図書館の職員の研修で、女の人が話しています。"},{"speaker":"F","text":"先週、こんなことがありました。この町の古い地図はどこですか、と尋ねられたのです。地図の棚へお連れするのはたやすい。私はそうせずに、二つ三つうかがってみました。すると本当に知りたかったのは、お住まいの土地が昔は何に使われていたか、ということでした。それでしたら、お調べするものが変わってまいります。こう申し上げますと、利用者をお待たせしてもかまわない、という意味に受け取られそうですが、そうではありません。棚まで往復してから聞き直すほうが、よほど長くお待たせします。尋ねられた言葉は、たいてい入り口です。入り口で二つ三つ問い返すのが、いちばんの近道だと考えております。"},{"speaker":"N","text":"女の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、土地の昔を先に調べる","choice":1},{"speaker":"N","text":"に、尋ねられた棚へ案内する","choice":2},{"speaker":"N","text":"さん、棚へ行く前に問い返す","choice":3},{"speaker":"N","text":"よん、棚まで一緒に往復する","choice":4}]},"N1-L-0134@2":{"uid":"N1-L-0134","revision":2,"audio":"audio/course2026_n1_L0134_v2.mp3","script":[{"speaker":"N","text":"靴の修理の講習会で、女の人が男の講師に質問しています。"},{"speaker":"F","text":"この講習の組み立てで、変えたい点があるそうですね。"},{"speaker":"M","text":"ええ。今は、初めの三日でかかとの替え方や糸のかけ方を覚え、最後の日にお客さまの歩き方の見方を習います。手を動かせるようになってから、見方を習うという順序ですね。どちらも要ることに異論はありません。減り方の癖を知らないまま直しますと、きれいに仕上がっても、三か月で同じ所がまた減ります。先に歩き方を見ておけば、この方は外側から減るからこちら側を厚くしよう、と手の動かし方までちがってきます。習う中身はそのままで、先に来るものだけを入れかえる。それだけで、直した靴が長もちします。"},{"speaker":"N","text":"男の講師はどのような考えを述べていますか。"},{"speaker":"N","text":"いち、歩き方を先に習う","choice":1},{"speaker":"N","text":"に、かかとを先に覚える","choice":2},{"speaker":"N","text":"さん、習う中身を増やす","choice":3},{"speaker":"N","text":"よん、減り方を客に教える","choice":4}]},"N1-L-0135@2":{"uid":"N1-L-0135","revision":2,"audio":"audio/n1_q3_41.mp3","script":[{"speaker":"N","text":"ラジオで、女の建築士が話しています。"},{"speaker":"F","text":"古い建物はできるだけ壊さずに残したほうがいい。近ごろはどこへ行ってもそう言われますし、私もその通りだと思っています。町の記憶が形として残っていることの値打ちは、数字では測れません。ただ、私が気になるのは、そこから先のことなんです。残すと決まった建物を、そのあとだれがどう使うのか。ここが決まらないまま工事だけが終わって、鍵のかかったまま何年も過ぎている建物を、私はいくつも見てきました。屋根を直すお金は集まっても、毎週そこを開けて人を迎える人は、なかなか集まりません。ですから図面を引く前に、その建物にだれが通うことになるのかを、はっきりさせておきます。私は仕事を引き受けるとき、必ずそこから話を始めることにしています。"},{"speaker":"N","text":"女の建築士が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、古い建物を残すこと","choice":1},{"speaker":"N","text":"に、先に使う人を決める","choice":2},{"speaker":"N","text":"さん、屋根を直すお金のこと","choice":3},{"speaker":"N","text":"よん、町の記憶を測る方法","choice":4}]},"N1-L-0136@1":{"uid":"N1-L-0136","revision":1,"audio":"audio/n1_q3_42.mp3","script":[{"speaker":"N","text":"大学の公開講座で、女の先生が話しています。"},{"speaker":"F","text":"外国語は早く始めたほうがいい。よくそう言われますし、私もそれを疑ってはいません。耳が柔らかいうちに音に触れておく利点は、調査でもはっきり出ています。ただ、私が申し上げたいのは、その先のことです。早く始めた人が、そのまま十年続けられるとはかぎりません。小さいころ教室に通っていた子どもの多くは、進学や部活を境に、ぱたりとやめてしまいます。その一方で、四十を過ぎてから始めて、二十年続けている方もいらっしゃる。続いた方に共通していたのは、その言葉で話す相手が生活の中にいたことでした。ですから始める時期を相談されたら、私はまず、続けられる相手をどう見つけるかを一緒に考えるようにしています。"},{"speaker":"N","text":"女の先生が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、子どもがやめる多さ","choice":1},{"speaker":"N","text":"に、早く始める利点","choice":2},{"speaker":"N","text":"さん、遅く始めるほうがよい","choice":3},{"speaker":"N","text":"よん、話す相手をつくる","choice":4}]},"N1-L-0137@2":{"uid":"N1-L-0137","revision":2,"audio":"audio/course2026_n1_L0137_v2.mp3","script":[{"speaker":"N","text":"プールの監視員の研修会で、女の人が話しています。"},{"speaker":"F","text":"おぼれている人というと、大きな声を上げて手を振っている姿を思い浮かべる方が多いのではないでしょうか。私も、この仕事に就くまではそう思っておりました。ところが、これまでに引き上げた方を振り返りますと、声を出せた方はほとんどおられません。息を吸うだけで精いっぱいで、叫ぶ余裕などありません。手も、水を押さえるように小さく動くだけで、大きくは振れません。つまり、少し離れた台の上からは、立ち泳ぎをしている人と見分けがつきません。去年うちで引き上げた子どもにも、すぐ横で泳いでいた方は気づいておりません。人手が足りないというお話も出ますが、うちは決まりより一人多く立てております。台に上がったら、にぎやかな一角より先に、動きの止まった人を目で追ってください。笛は、そのあとで間に合います。"},{"speaker":"N","text":"女の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、止まった人を先に探す","choice":1},{"speaker":"N","text":"に、笛の合図を練習する","choice":2},{"speaker":"N","text":"さん、声を上げる人を助ける","choice":3},{"speaker":"N","text":"よん、監視の人数を増やす","choice":4}]},"N1-L-0138@3":{"uid":"N1-L-0138","revision":3,"audio":"audio/course2026_n1_L0138_v3.mp3","script":[{"speaker":"N","text":"社内の勉強会で、男の人が話しています。"},{"speaker":"M","text":"会議は短く切り上げたほうがいい。ここ数年、どの職場でもそう言われるようになりました。私も賛成です。一時間の会議を四十分にしてみて、困ったことは特にありませんでした。ただ、私が気にかけているのは、その先で起きていることです。短くした会議では、決まったことを口頭で確かめて、そのまま解散しがちです。すると三週間後に、だれが何をいつまでにやるはずだったのか、思い出せる人がいなくなる。先月の企画も、そこで一度止まってしまいました。ですから当部では、会議のたびに一人、決まったことだけを一枚の紙に書き残す係を置くことにしました。時間を詰めるほど、この一枚が効いてきます。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、会議を短く切り上げる","choice":1},{"speaker":"N","text":"に、出る人の数をしぼる","choice":2},{"speaker":"N","text":"さん、企画が止まったこと","choice":3},{"speaker":"N","text":"よん、決めたことを紙に残す","choice":4}]},"N1-L-0139@1":{"uid":"N1-L-0139","revision":1,"audio":"audio/n1_q3_45.mp3","script":[{"speaker":"N","text":"醸造所の見学会で、男の人がしょうゆ蔵の女の人に質問しています。"},{"speaker":"M","text":"この蔵で一番大変だったのは、どんな時ですか。"},{"speaker":"F","text":"十年ほど前の夏の晩ですね。しょうゆのもろみ、仕込んだものを寝かせる蔵で、戸を閉めて帰ろうとしましたら、奥の大きな木のおけから、ふだんより大きな音がしていたんです。のぞいたら、泡がふちのすぐ下まで上がって、温度が上がりすぎていました。父を呼び、ふたりで長い棒を入れ、夜通しかき回しました。窓を開けて、氷を運び、朝までそばにいました。空が明るくなるころ、泡は落ち着きました。その年の仕上がりが分かったのは、一年寝かせて、蔵から出した時です。ねらっていた味ではありませんでした。香りが強く出て、色も濃くなっておりました。そのおけのものは、別の名前をつけて出しました。あの晩から、うまくいかなかった夜のことこそ、日誌に書き残すようにしています。"},{"speaker":"N","text":"女の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、別の名前をつけて出す","choice":1},{"speaker":"N","text":"に、失敗した夜を書き残す","choice":2},{"speaker":"N","text":"さん、温度を上げずに見回る","choice":3},{"speaker":"N","text":"よん、うまくいった夜だけ残す","choice":4}]},"N1-L-0140@1":{"uid":"N1-L-0140","revision":1,"audio":"audio/n1_q3_46.mp3","script":[{"speaker":"N","text":"点字図書館で、男の人が話しています。"},{"speaker":"M","text":"先日、長く通ってくださっている方に、こう言われました。ここに新しい本が並ぶのは、いつも世の中より一年遅いですね、と。私はその場で聞き返しました。この一年、どの本を待っていらっしゃいましたか。すると、題名が三つ出てきました。三つとも、うちがまだ手をつけていない本でした。点字の本は、入力する者と、それを読んで直す者と、ふたりがかりで作ります。一冊に半年から一年かかります。速さは、そう縮められません。そこで今年から、次に手をつける三冊を、利用者の投票で選んでいただくことにしました。並ぶまでの時間は同じでも、待つ気持ちがまるでちがってまいります。"},{"speaker":"N","text":"男の人はどのような考えを述べていますか。"},{"speaker":"N","text":"いち、点字を作る時間を縮める","choice":1},{"speaker":"N","text":"に、入力する人を増やす","choice":2},{"speaker":"N","text":"さん、利用者に待ち方を聞く","choice":3},{"speaker":"N","text":"よん、次の本を利用者が選ぶ","choice":4}]},"N1-L-0141@1":{"uid":"N1-L-0141","revision":1,"audio":"audio/n1_q3_47.mp3","script":[{"speaker":"N","text":"看護学校の講義で、女の先生が話しています。"},{"speaker":"F","text":"実習が終わったあと、そこから伸びる人と、そうでない人に分かれます。教室で習うより、先輩の手つきを見せてもらったほうが早く覚えられる。それはそのとおりで、私も反対ではありません。ただし、一つ条件がつきます。見て覚えるやり方が効くのは、見たあとに、それを言葉へ直す時間があるときだけです。なぜあの順で手を動かしたのかを、その日のうちに書き出し、次の日に先輩へ確かめる。そこまでそろって、初めて身につきます。今の実習は、朝から夕方まで作業が詰まっていて、見た直後に次の部屋へ移ります。書き出す時間がどこにもありません。見て覚えるのが一番だという言い方は、今のままの実習では成り立たないのです。"},{"speaker":"N","text":"女の先生は、何を問題だと考えていますか。"},{"speaker":"N","text":"いち、手つきを見られない","choice":1},{"speaker":"N","text":"に、作業の順が決まらない","choice":2},{"speaker":"N","text":"さん、書き出す時間がない","choice":3},{"speaker":"N","text":"よん、教室の時間が足りない","choice":4}]},"N1-L-0142@1":{"uid":"N1-L-0142","revision":1,"audio":"audio/n1_q3_48.mp3","script":[{"speaker":"N","text":"工場の見学会で、男の人が話しています。"},{"speaker":"M","text":"この工程には、測定器を使った検査と、人の手による検査の二つを並べて置いています。測定器は、決めた寸法から百分の一ミリずれても止まります。人の目では追いつかない細かさですし、記録も自動で残ります。一方、手に持って回す検査では、寸法は合っているのに、回したときの音がいつもと違う、という品物が見つかります。数字にはまだ表れていない変化です。どちらか一方を選ぶという話には、うちではなっていません。二つを並べているのは、機械が見つけられるものと、人が見つけられるものが、きれいには重ならないからです。決めた形からのずれは機械が、いつもとの違いは人が受け持ちます。この二本立てで、うちの検査は成り立っています。"},{"speaker":"N","text":"男の人は何について話していますか。"},{"speaker":"N","text":"いち、手で回して分かる音","choice":1},{"speaker":"N","text":"に、検査を減らして早める","choice":2},{"speaker":"N","text":"さん、測定器だけにそろえる","choice":3},{"speaker":"N","text":"よん、二つの検査で拾う違い","choice":4}]},"N1-L-0143@1":{"uid":"N1-L-0143","revision":1,"audio":"audio/n1_q3_49.mp3","script":[{"speaker":"N","text":"測量の実習で、男の人が話しています。"},{"speaker":"M","text":"始める前に、昔やらかした話をしておくね。この仕事について三年目の秋、山の中で高さを測ってた。雨が近くて、早く下りたい。手元の紙がぬれるのがいやでね、読み取った数を頭に入れたまま、四か所を続けて測ったんだ。ふもとで日誌に書き写したら、二か所の数が入れかわってた。気づいたのは、机の上で図を書いたあと。次の週、同じ山をもう一度登ることになった。それからは、頭で覚えるのをやめてる。ぬれてもいい紙を胸に入れて、読んだらその場で書く。書いたら、組んだ相手に声に出して読み上げてもらう。ふたりそろって同じ数になるまで、次の場所へは動かない。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、雨の日は測らない","choice":1},{"speaker":"N","text":"に、四か所まとめて測る","choice":2},{"speaker":"N","text":"さん、読んだ数を頭に入れる","choice":3},{"speaker":"N","text":"よん、書いて相手と確かめる","choice":4}]},"N1-L-0144@1":{"uid":"N1-L-0144","revision":1,"audio":"audio/n1_q3_50.mp3","script":[{"speaker":"N","text":"漁協の集まりで、男の人が女の人に話を聞いています。"},{"speaker":"M","text":"浜の掃除で集めたごみ、今年はちがう数え方をしたそうですね。"},{"speaker":"F","text":"ええ。いつもは、軽トラック何台という言い方をしていました。重さで量りますと、そのほとんどは流れ着いた木で、片づけの手間もそこにかかります。今年は、集めたものを大きな板の上に広げて、一つずつ数えてみたんです。全部で千二百ありました。そのうち九百あまりが、小指の先ほどの小さなプラスチックのかけらでした。重さにすれば、ほんのわずかにしかなりません。数で見れば、浜のごみの大半はこのかけらだということになります。木は運べば終わります。かけらは砂の中に残ります。来年の掃除は、重さを競うのをやめて、このかけらをどこまで減らせるかでやってみます。"},{"speaker":"N","text":"女の人は主に何を伝えようとしていますか。"},{"speaker":"N","text":"いち、重さで量って競う","choice":1},{"speaker":"N","text":"に、流れ着いた木を運ぶ","choice":2},{"speaker":"N","text":"さん、軽トラック何台で数える","choice":3},{"speaker":"N","text":"よん、小さなかけらを減らす","choice":4}]},"N1-L-0145@2":{"uid":"N1-L-0145","revision":2,"audio":"audio/course2026_n1_L0145_v2.mp3","script":[{"speaker":"N","text":"市民講座で、男の人が話しています。"},{"speaker":"M","text":"待つ時間の過ごしやすい場所には、似た工夫があります。思い当たるものを、順に三つお話しします。町の診療所では、受付で番号札を渡し、いま何番まで進んだかを壁の板に出しています。山小屋では、水場を三十分ずつ区切って、次はどの部屋の番かを表に書いて貼っています。近所の小学校では、一輪車の貸し出しに砂時計を置いて、砂が落ちたら次の子に回す決まりだそうです。どれも、順番そのものが速く回るわけではありません。並べてみると、三つは一つの点でつながっています。待っている人に、あとどれくらいで自分の番が来るかという見通しを渡しているのです。終わりが見えてさえいれば、人は思いのほか長く待てます。私はまず、そこに手を入れることにしています。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、待つ人に見通しを渡す","choice":1},{"speaker":"N","text":"に、待ち時間を短くする","choice":2},{"speaker":"N","text":"さん、砂時計で順番を回す","choice":3},{"speaker":"N","text":"よん、椅子や空調に気を配る","choice":4}]},"N1-L-0146@1":{"uid":"N1-L-0146","revision":1,"audio":"audio/n1_q3_52.mp3","script":[{"speaker":"N","text":"保護者会で、男の人が話しています。"},{"speaker":"M","text":"最後に、お願いを一つ申し上げます。学校の様子をご家庭にお伝えする、というのが今日のお話でした。ここからは、逆をお願いしたいのです。教室では、子どもたちは同じ形の机に座り、同じことをしています。ですから、教室の中でその子がどう見えるかは、私にもよく分かります。家に帰ってからのことは、私には見えません。台所に立っているときによくしゃべる子もいれば、車に乗ると急に話しだす子もいると聞きます。そこで、今お配りした紙の裏に、お子さんがよくしゃべるのはどんなときか、一行だけ書いて、帰りに箱へ入れていってください。来週からの声のかけ方が、そこで決まります。"},{"speaker":"N","text":"男の人が最も言いたいことは何ですか。"},{"speaker":"N","text":"いち、学校の様子を家に伝える","choice":1},{"speaker":"N","text":"に、家での様子を一行書く","choice":2},{"speaker":"N","text":"さん、教室での見え方を聞く","choice":3},{"speaker":"N","text":"よん、台所や車で話しかける","choice":4}]},"N1-L-0147@1":{"uid":"N1-L-0147","revision":1,"audio":"audio/n1_q3_53.mp3","script":[{"speaker":"N","text":"山岳ガイドの研修で、男の人が話しています。"},{"speaker":"M","text":"初めての人を連れて歩く時、休みをどこで取るか。やり方は二つ知られてる。時計で決めるやり方と、申し出を待つやり方だ。時計で決めるやり方は公平に見える。ただ、同じ道でも息の上がり方は人によってちがうから、先に苦しくなった人には遅すぎる。申し出を待つやり方はどうか。こっちは行き届いて見えるが、一番苦しい人ほど、迷惑をかけまいとして言い出さない。おれが二十年頼りにしてきたのは、そのどっちでもない。後ろから聞こえてくる話し声だ。歩きながらの世間話がふっと途切れたら、そこで止まる。話し声が減るという変化は、つらいと口に出す前に必ず出てくる。"},{"speaker":"N","text":"男の人は何について話していますか。"},{"speaker":"N","text":"いち、時計で休みを決める","choice":1},{"speaker":"N","text":"に、申し出を待って休む","choice":2},{"speaker":"N","text":"さん、話し声で休みを決める","choice":3},{"speaker":"N","text":"よん、息の上がり方で決める","choice":4}]},"N1-L-0148@1":{"uid":"N1-L-0148","revision":1,"audio":"audio/n1_q3_54.mp3","script":[{"speaker":"N","text":"消防の講習会で、女の人が話しています。"},{"speaker":"F","text":"ご家庭に付ける住宅用火災警報器のお話です。決まりでは、寝ている部屋と階段に付けていただくことになっております。今日は、まず一つ、というならばどこへ付けるかというお話です。付ける場所は、たいてい台所か、寝ている部屋のどちらかになります。台所は火を使いますから、一番先に鳴りそうに思えます。寝ている部屋のほうは、火を使いませんから、後回しにされがちです。私どもが火事のあとに伺って分かりますのは、逃げ遅れた方の多くが、寝ている部屋で見つかるということです。台所で燃え始めても、起きていれば、においでも音でも気づけます。眠っている間に煙が入ってきますと、目が覚めないまま動けなくなります。ですから、はっきり申し上げます。付ける場所は台所ではなく、寝ている部屋です。"},{"speaker":"N","text":"女の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、寝室は後回しでよい","choice":1},{"speaker":"N","text":"に、先に付けるのは寝室だ","choice":2},{"speaker":"N","text":"さん、先に付けるのは台所だ","choice":3},{"speaker":"N","text":"よん、付けるのは火を使う所","choice":4}]},"N1-L-0149@1":{"uid":"N1-L-0149","revision":1,"audio":"audio/n1_q3_55.mp3","script":[{"speaker":"N","text":"養蜂の講習会で、男の人が話しています。"},{"speaker":"M","text":"三年前に、思い切って巣箱を倍の四十に増やしました。採れる蜜の量は、その年、確かに一・八倍になりました。増やしたこと自体を悔やんではおりませんし、今も三十は置いております。ただ、翌年の冬に、十の群れが越冬に失敗しました。調べていて気づいたのは、山に咲く花の量は、私の都合では増えないということです。巣箱だけを増やしても、周りの木が同じなら、一つの群れが持ち帰れる蜜は薄くなる。夏の終わりに蓄えが足りず、寒さに耐えられなかったわけです。それからは、春先に山を歩いて、花をつける木を数えるところから一年を始めております。数えた本数を見てから、その年に置く巣箱の数を決める。順番を入れ替えただけですが、越冬に失敗する群れは、ぐっと減りました。"},{"speaker":"N","text":"男の人は何について話していますか。"},{"speaker":"N","text":"いち、巣箱を増やして蜜を得る","choice":1},{"speaker":"N","text":"に、寒さに強い群れを選ぶ","choice":2},{"speaker":"N","text":"さん、山の花を増やす方法","choice":3},{"speaker":"N","text":"よん、木を数えて巣箱を決める","choice":4}]},"N1-L-0150@1":{"uid":"N1-L-0150","revision":1,"audio":"audio/n1_q3_56.mp3","script":[{"speaker":"N","text":"駅の職員の研修会で、女の人が話しています。"},{"speaker":"F","text":"駅の案内を、四つの言語で出すようになって三年たちます。これはよく効いています。それは疑いようがありません。券売機の前で困っている方は目に見えて減りましたし、うちの職員も、指をさして説明できるようになりました。この取り組みは今のまま続けます。減らす気はありません。ただ、この春に気づいたことをお伝えしておきます。表示が行き届いた今も、道を尋ねてくる方の数は減っていないのです。矢印だけでは決められない場面が、旅の途中には必ずあります。終電に間に合うか、乗り換えに走らなくてよいか。そこで頼りになるのは、答えられる人が近くにいるかどうかです。次の一年は、答えられる人を改札の外にも置くことに力を入れます。"},{"speaker":"N","text":"女の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、券売機で困る客が減った","choice":1},{"speaker":"N","text":"に、表示をもっと増やす","choice":2},{"speaker":"N","text":"さん、終電を自分で調べる","choice":3},{"speaker":"N","text":"よん、答える人を改札の外に","choice":4}]},"N1-L-0151@1":{"uid":"N1-L-0151","revision":1,"audio":"audio/n1_q4_01.mp3","script":[{"speaker":"F","text":"恐れ入りますが、この書類、部長にはもうお目通しいただけましたでしょうか。"},{"speaker":"N","text":"いち、ええ、昨日ご覧いただきました。","choice":1},{"speaker":"N","text":"に、いえ、まだお目にかかっていません。","choice":2},{"speaker":"N","text":"さん、はい、部長が今拝見中です。","choice":3}]},"N1-L-0152@1":{"uid":"N1-L-0152","revision":1,"audio":"audio/n1_q4_02.mp3","script":[{"speaker":"M","text":"みんな締め切りに追われてるのに、ずいぶん余裕があるんだね。"},{"speaker":"N","text":"いち、じゃあ、ゆっくりどうぞ。","choice":1},{"speaker":"N","text":"に、ええ、予算に余裕が出ました。","choice":2},{"speaker":"N","text":"さん、すみません、すぐお手伝いします。","choice":3}]},"N1-L-0153@1":{"uid":"N1-L-0153","revision":1,"audio":"audio/n1_q4_03.mp3","script":[{"speaker":"F","text":"来週の月曜までにというのは、正直、厳しいものがありまして。"},{"speaker":"N","text":"いち、では、水曜にしましょうか。","choice":1},{"speaker":"N","text":"に、厳しく言ってしまい、すみません。","choice":2},{"speaker":"N","text":"さん、わかりました、月曜に伺います。","choice":3}]},"N1-L-0154@2":{"uid":"N1-L-0154","revision":2,"audio":"audio/course2026_n1_L0154_v2.mp3","script":[{"speaker":"M","text":"まさか、例の企画書、まだ手をつけていないなんてことはないよね。"},{"speaker":"N","text":"いち、ええ、汚れないように気をつけています。","choice":1},{"speaker":"N","text":"に、いえ、もう始めています。","choice":2},{"speaker":"N","text":"さん、はい、手が空いたら始めます。","choice":3}]},"N1-L-0155@1":{"uid":"N1-L-0155","revision":1,"audio":"audio/n1_q4_05.mp3","script":[{"speaker":"F","text":"悪いんだけど、この資料、ついでにコピーしてきてもらえないかな。"},{"speaker":"N","text":"いち、いいよ、何部コピーすればいい？","choice":1},{"speaker":"N","text":"に、じゃあ、私の分もついでに頼むね。","choice":2},{"speaker":"N","text":"さん、うん、ついででいいよ。","choice":3}]},"N1-L-0156@1":{"uid":"N1-L-0156","revision":1,"audio":"audio/n1_q4_06.mp3","script":[{"speaker":"M","text":"わざわざお届けいただかなくても、こちらから取りに伺いましたのに。"},{"speaker":"N","text":"いち、いえ、近くまで来たものですから。","choice":1},{"speaker":"N","text":"に、では、明日取りに伺いますね。","choice":2},{"speaker":"N","text":"さん、お越しいただき、恐縮です。","choice":3}]},"N1-L-0157@1":{"uid":"N1-L-0157","revision":1,"audio":"audio/n1_q4_07.mp3","script":[{"speaker":"F","text":"あれだけ念を押しておいたのに、また同じところを間違えてるのよ。"},{"speaker":"N","text":"いち、一度ちゃんと話したほうがいいね。","choice":1},{"speaker":"N","text":"に、間違いがなくて何よりだね。","choice":2},{"speaker":"N","text":"さん、じゃあ、もう一度押してみたら。","choice":3}]},"N1-L-0158@2":{"uid":"N1-L-0158","revision":2,"audio":"audio/course2026_n1_L0158_v2.mp3","script":[{"speaker":"M","text":"あすの練習だけど、いつもの体育館が使えなくなったらしいよ。"},{"speaker":"N","text":"いち、じゃあ、体育館に集まればいいんだね？","choice":1},{"speaker":"N","text":"に、いつもの体育館は、あすも使えるんだね。","choice":2},{"speaker":"N","text":"さん、じゃあ、あすはどこでやるの？","choice":3}]},"N1-L-0159@1 :"いち、まだ何も始めていないのか。","choice":1},{"speaker":"N","text":"に、進んだらまた報告してくれ。","choice":2},{"speaker":"N","text":"さん、わかった。午後にでも決めよう。","choice":3}]},"N1-L-0166@1":{"uid":"N1-L-0166","revision":1,"audio":"audio/n1_q4_16.mp3","script":[{"speaker":"M","text":"恐れ入ります、こちらの商品、取り寄せということになりますが、よろしいでしょうか。"},{"speaker":"N","text":"いち、では、お取りしましょうか。","choice":1},{"speaker":"N","text":"に、はい、では店にお寄りします。","choice":2},{"speaker":"N","text":"さん、急いでいるので、いつ届きますか。","choice":3}]},"N1-L-0167@1":{"uid":"N1-L-0167","revision":1,"audio":"audio/n1_q4_17.mp3","script":[{"speaker":"F","text":"別に怒ってるってわけでもないんだけどね。"},{"speaker":"N","text":"いち、それなら怒られなくてよかったね。","choice":1},{"speaker":"N","text":"に、でも、そういう顔してるよ。","choice":2},{"speaker":"N","text":"さん、じゃあ、やっぱり怒ってるんだ。","choice":3}]},"N1-L-0168@2":{"uid":"N1-L-0168","revision":2,"audio":"audio/n1_q4_18.mp3","script":[{"speaker":"M","text":"実は頼みがあってね、日曜に引っ越しを手伝ってもらえないかな。"},{"speaker":"N","text":"いち、新しい家は駅に近いんだね。","choice":1},{"speaker":"N","text":"に、じゃあ、日曜に手伝ってもらうね。","choice":2},{"speaker":"N","text":"さん、午前中だけなら、手伝えるよ。","choice":3}]},"N1-L-0169@2":{"uid":"N1-L-0169","revision":2,"audio":"audio/course2026_n1_L0169_v2.mp3","script":[{"speaker":"F","text":"あいにく山川はただ今席を外しておりまして、戻りましたら折り返しご連絡させましょうか。"},{"speaker":"N","text":"いち、いえ、山川は外出中です。","choice":1},{"speaker":"N","text":"に、では、折り返しお願いします。","choice":2},{"speaker":"N","text":"さん、では、山川は戻りしだい、こちらからお電話いたします。","choice":3}]},"N1-L-0170@1":{"uid":"N1-L-0170","revision":1,"audio":"audio/n1_q4_20.mp3","script":[{"speaker":"F","text":"先日の見学、山下さんだけ、集合の時間にいらっしゃいませんでしたね。"},{"speaker":"N","text":"いち、はい、皆さんとご一緒しまして。","choice":1},{"speaker":"N","text":"に、見学先の建物が立派でして。","choice":2},{"speaker":"N","text":"さん、電車が止まって、駅で足止めされまして。","choice":3}]},"N1-L-0171@1":{"uid":"N1-L-0171","revision":1,"audio":"audio/n1_q4_21.mp3","script":[{"speaker":"M","text":"今回の発表、話の運びが分かりやすくて見事だったよ。"},{"speaker":"N","text":"いち、みんなが助けてくれたおかげだよ。","choice":1},{"speaker":"N","text":"に、次からはもっと気をつけるようにするよ。","choice":2},{"speaker":"N","text":"さん、次の発表会は来月の初めだったよね。","choice":3}]},"N1-L-0172@2":{"uid":"N1-L-0172","revision":2,"audio":"audio/course2026_n1_L0172_v2.mp3","script":[{"speaker":"M","text":"あの人に頼むくらいなら、自分でやったほうが早いんじゃないですか。"},{"speaker":"N","text":"いち、まあ、任せてみましょうよ。","choice":1},{"speaker":"N","text":"に、では、あの人が自分でやるそうです。","choice":2},{"speaker":"N","text":"さん、ええ、あの人が自分に頼むそうです。","choice":3}]},"N1-L-0173@2":{"uid":"N1-L-0173","revision":2,"audio":"audio/course2026_n1_L0173_v2.mp3","script":[{"speaker":"M","text":"すみません、電車が止まってしまって、三十分ほど遅れそうなんです。"},{"speaker":"N","text":"いち、あ、道が混んでいたんですね。","choice":1},{"speaker":"N","text":"に、わかりました、先に始めています。","choice":2},{"speaker":"N","text":"さん、じゃあ、三十分も早く着くんですね。","choice":3}]},"N1-L-0174@1":{"uid":"N1-L-0174","revision":1,"audio":"audio/n1_q4_24.mp3","script":[{"speaker":"M","text":"来週の山登り、天気次第では中止もありうるって。"},{"speaker":"N","text":"いち、そう、中止になったんだね。","choice":1},{"speaker":"N","text":"に、じゃあ、前の日に連絡し合おうか。","choice":2},{"speaker":"N","text":"さん、天気なら明日は晴れるらしいよ。","choice":3}]},"N1-L-0175@3":{"uid":"N1-L-0175","revision":3,"audio":"audio/course2026_n1_L0175_v3.mp3","script":[{"speaker":"F","text":"レポートの提出、事情によっては延ばしていただけると伺ったのですが。"},{"speaker":"N","text":"いち、ええ、届けを出せば一週間までです。","choice":1},{"speaker":"N","text":"に、では、私が代わりに提出いたします。","choice":2},{"speaker":"N","text":"さん、では、事情を伺いに行きます。","choice":3}]},"N1-L-0176@1":{"uid":"N1-L-0176","revision":1,"audio":"audio/n1_q4_26.mp3","script":[{"speaker":"M","text":"先週見ていただいたばかりなのに、また同じ音がするんですが。"},{"speaker":"N","text":"いち、音が出るようになってよかったです。","choice":1},{"speaker":"N","text":"に、失礼しました。すぐ伺います。","choice":2},{"speaker":"N","text":"さん、では、買い替えもご検討ください。","choice":3}]},"N1-L-0177@1":{"uid":"N1-L-0177","revision":1,"audio":"audio/n1_q4_27.mp3","script":[{"speaker":"F","text":"差し支えなければ、こちらの写真、記事に使わせていただきたいのですが。"},{"speaker":"N","text":"いち、いえ、記事はまだ読んでいません。","choice":1},{"speaker":"N","text":"に、出典さえ書いていただければ。","choice":2},{"speaker":"N","text":"さん、私も一枚お借りしたいです。","choice":3}]},"N1-L-0178@1":{"uid":"N1-L-0178","revision":1,"audio":"audio/n1_q4_28.mp3","script":[{"sp -L-0191","revision":3,"audio":"audio/course2026_n1_L0191_v3.mp3","script":[{"speaker":"M","text":"この近くで、落ち着いて話ができる店、どこかご存じないですか。"},{"speaker":"N","text":"いち、裏通りの喫茶店が静かですよ。","choice":1},{"speaker":"N","text":"に、いえ、席はまだ空いていますよ。","choice":2},{"speaker":"N","text":"さん、その喫茶店はどこの通りにありますか。","choice":3}]},"N1-L-0192@1":{"uid":"N1-L-0192","revision":1,"audio":"audio/n1_q4_42.mp3","script":[{"speaker":"M","text":"上と下の板挟みで、こちらの身にもなってほしいですよ。"},{"speaker":"N","text":"いち、上も下も気楽でいいですよね。","choice":1},{"speaker":"N","text":"に、上の階に移られてはどうですか。","choice":2},{"speaker":"N","text":"さん、わかります。間に立つのは大変ですね。","choice":3}]},"N1-L-0193@1":{"uid":"N1-L-0193","revision":1,"audio":"audio/n1_q4_43.mp3","script":[{"speaker":"F","text":"そのプリンター、一度電源を入れ直してみると直ることが多いんですけど。"},{"speaker":"N","text":"いち、直ってから入れ直してみますね。","choice":1},{"speaker":"N","text":"に、では、電源は切らずにおきます。","choice":2},{"speaker":"N","text":"さん、それが、さっき試したのですがだめで。","choice":3}]},"N1-L-0194@1":{"uid":"N1-L-0194","revision":1,"audio":"audio/n1_q4_44.mp3","script":[{"speaker":"M","text":"急ぎでないなら、そこは後回しでかまいませんよ。"},{"speaker":"N","text":"いち、では見積もりを先にします。","choice":1},{"speaker":"N","text":"に、はい、今すぐ取りかかります。","choice":2},{"speaker":"N","text":"さん、急ぎのものから後回しにしますね。","choice":3}]},"N1-L-0195@1":{"uid":"N1-L-0195","revision":1,"audio":"audio/n1_q4_45.mp3","script":[{"speaker":"F","text":"この案内図、初めての人でも迷わないね。ずいぶん工夫したんだね。"},{"speaker":"N","text":"いち、私も迷わずにこちらまで来られました。","choice":1},{"speaker":"N","text":"に、何度も直したかいがありました。","choice":2},{"speaker":"N","text":"さん、これから工夫してみます。","choice":3}]},"N1-L-0196@1":{"uid":"N1-L-0196","revision":1,"audio":"audio/n1_q4_46.mp3","script":[{"speaker":"M","text":"せっかくこの辺まで来たんだし、あの古い橋、見ていかない？"},{"speaker":"N","text":"いち、ありがとう、案内してもらえて助かった。","choice":1},{"speaker":"N","text":"に、うん、写真では見たことがある。","choice":2},{"speaker":"N","text":"さん、いいね、暗くならないうちに行こう。","choice":3}]},"N1-L-0197@2":{"uid":"N1-L-0197","revision":2,"audio":"audio/course2026_n1_L0197_v2.mp3","script":[{"speaker":"F","text":"この店、いつ来ても混んでるね。よっぽどおいしいんだろうね。"},{"speaker": peaker":"N","text":"いち、取引先はまだ何も言ってこないようです。","choice":1},{"speaker":"N","text":"に、見積書の書き方はこれでいいですか。","choice":2},{"speaker":"N","text":"さん、あすの朝までに仕上げます。","choice":3}]},"N1-L-0211@1":{"uid":"N1-L-0211","revision":1,"audio":"audio/n1_q4_61.mp3","script":[{"speaker":"F","text":"急な話で恐縮ですが、明日、来ていただくわけにはいきませんか。"},{"speaker":"N","text":"いち、では、来なくていいんですね。","choice":1},{"speaker":"N","text":"に、明日ですか。何とか都合をつけます。","choice":2},{"speaker":"N","text":"さん、はい、昨日は失礼しました。","choice":3}]},"N1-L-0212@2":{"uid":"N1-L-0212","revision":2,"audio":"audio/course2026_n1_L0212_v2.mp3","script":[{"speaker":"N","text":"会社の会議室で、女の人と男の人が、部長の提案について話しています。"},{"speaker":"F","text":"部長からお話のあった、月に一度の勉強会ですが、だれが話すかが決まっていませんね。"},{"speaker":"M","text":"ええ。部長ご自身は、毎回でも引き受けるとおっしゃっていますし、よその会社と合同で開いてはどうか、という声もあります。"},{"speaker":"F","text":"部長おひとりでは、半年ももたないと思います。よその会社と合同というのも、日どりを合わせるだけで骨が折れますよ。それより、その道の講師をお呼びしましょう。社内の人間だけでは、話の中身が偏りますから。"},{"speaker":"M","text":"なるほど。ただ、去年、社員に聞いたところ、いちばん多かったのは、うちの仕事に引きつけた話が聞きたいという声でした。外の方の講義は、話としては立派でも、終わったあとに、ではうちではどうするのか、が残るんです。"},{"speaker":"F","text":"そういう声が出ていたんですか。"},{"speaker":"M","text":"ええ。各課の者が持ち回りで、うまくいった事例を話す形なら、その場で質問にも答えられます。"},{"speaker":"F","text":"それを聞いてしまうと、講師にこだわる理由はありませんね。わたしの案は下げます。"},{"speaker":"M","text":"では、各課の者が順番に話す形で。第一回は、うちの課で引き受けましょうか。"},{"speaker":"F","text":"ええ、そうしましょう。来月の予定表に入れておきます。"},{"speaker":"N","text":"ふたりは、どの進め方に決めましたか。"},{"speaker":"N","text":"いち、各課の社員が話す案","choice":1},{"speaker":"N","text":"に、よその会社と合同で開く案","choice":2},{"speaker":"N","text":"さん、部長が毎回話す案","choice":3},{"speaker":"N","text":"よん、外部の講師を招く案","choice":4}]},"N1-L-0213@2":{"uid":"N1-L-0213","revision":2,"audio":"audio/course2026_n1_L0213_v2.mp3","script":[{"speaker":"N","text":"飲み物の会社で、女の人と男の人が、新しいお茶の名前の案について話しています。"},{"speaker":"F","text":"秋に出すほうじ茶の名前、案が四つ出そろいました。一つ目は「みどりのしずく」。二つ目は「やすらぎ茶」。三つ目は「まいにちほうじ茶」。四つ目は「香りの旅」です。"},{"speaker":"M","text":"一つ目は音の並びがきれいですね。ただ、調べたところ、よその会社の緑茶に、ごく近い名前があるそうです。棚に並べば取り違えられますし、あとで面倒なことになりかねません。"},{"speaker":"F","text":"それは避けたいですね。では、四つ目はいかがですか。"},{"speaker":"M","text":"「香りの旅」は、聞いただけでは何の商品か分かりません。入浴剤か旅行の広告かと思われては、手に取ってもらえないでしょう。"},{"speaker":"F","text":"たしかに。二つ目の「やすらぎ茶」は、落ち着いた感じで悪くないと思うのですが。"},{"speaker":"M","text":"悪くはないんです。ただ今回は、水筒に入れて持ち歩く二十代に届けたいんです。あの名前だと、親の世代の飲み物という顔になってしまいます。"},{"speaker":"F","text":"では三つ目ですか。長すぎてラベルに入らないと、はじめは思っていました。"},{"speaker":"M","text":"デザインの担当に確かめたら、細いびんのラベルにもきちんと収まるそうです。飲む場面がそのまま名前になっていて、覚えやすいですし。"},{"speaker":"F","text":"ええ、これで会議にかけましょう。"},{"speaker":"N","text":"二人は、どの名前に決めましたか。"},{"speaker":"N","text":"いち、香りの旅","choice":1},{"speaker":"N","text":"に、みどりのしずく","choice":2},{"speaker":"N","text":"さん、まいにちほうじ茶","choice":3},{"speaker":"N","text":"よん、やすらぎ茶","choice":4}]},"N1-L-0214@4":{"uid":"N1-L-0214","revision":4,"audio":"audio/course2026_n1_L0214_v3.mp3","script":[{"speaker":"N","text":"市役所で、女の人と男の人が、夏祭りの企画について話しています。"},{"speaker":"F","text":"今年の夏祭りですが、去年の反省会で決めた四つのことが、どうしても全部は成り立ちません。"},{"speaker":"M","text":"やぐら、つまり太鼓を打つ高い台を組むこと、縁日の店を出すこと、灯ろうを川に流すこと、それから中学生に手伝ってもらうこと、でしたね。"},{"speaker":"F","text":"ええ。ところが、広場の東側が新しい駐輪場になって、使える広さが去年よりだいぶ狭いんです。"},{"speaker":"M","text":"広場が狭くなったわけですか。灯ろうは川べりで流しますから、広場とは関わりがありませんね。"},{"speaker":"F","text":"そうなんです。中学生には、その灯ろうの受け渡しを手伝ってもらう約束です。学校からもぜひにと言われていますし、外せません。"},{"speaker":"M","text":"縁日の店は十軒ほどでしたか。あれなら、通路の脇に寄せれば場所は取りません。子ども連れの家族がいちばん楽しみにしているものですし。"},{"speaker":"F","text":"そうすると、残るのはやぐらですね。組むのに二日かかりますし、あの台は広場の真ん中を占めますから、店を置く所がなくなります。"},{"speaker":"M","text":"踊りそのものは、広場の真ん中に輪を作って、音楽を流せば続けられますね。"},{"speaker":"F","text":"ええ。太鼓の台は、来年、広場が元に戻ってからにしましょう。"},{"speaker":"M","text":"では、そのようにまとめて、自治会にお伝えします。"},{"speaker":"N","text":"今年の夏祭りでは、何をあきらめることになりましたか。"},{"speaker":"N","text":"いち、縁日の店を出すこと","choice":1},{"speaker":"N","text":"に、やぐらを組むこと","choice":2},{"speaker":"N","text":"さん、灯ろうを川に流すこと","choice":3},{"speaker":"N","text":"よん、中学生に手伝ってもらうこと","choice":4}]},"N1-L-0215@2":{"uid":"N1-L-0215","revision":2,"audio":"audio/course2026_n1_L0215_v2.mp3","script":[{"speaker":"N","text":"会社で、男の人と女の人が、社内報の見直しについて話しています。"},{"speaker":"M","text":"社内報の見直しですが、来年度は何か手を入れたいという話が出て 存案を説明しています。そのあと、担当者二人が話しています。"},{"speaker":"M","text":"甲案は、展示全体を高精細の映像で記録します。見栄えは保てますが、会場内の発言は字幕による要約だけです。乙案は、作品の写真と発言の全文を対応させた記録です。ただし、新たな発言を後から追加することはできません。丙案は、作品の写真と発言の記録を基本に、展示後の制作者の補足も追加できる形です。入力や権限を管理する担当者を継続して置く必要があります。丁案は、作品写真のみの冊子です。管理の手間は最も少なくなります。"},{"speaker":"F","text":"今回残したいのは、完成した姿だけではなく、制作者が何を考えて変えていったかという過程です。展示が終わってから気づいたことも、記録に加えられるといいのですが。"},{"speaker":"M","text":"となると管理は必要ですね。担当者を続けて置くのは難しいと思っていたんですが、先ほど、来年度の担当を確保できると連絡がありました。"},{"speaker":"F","text":"それなら、継続管理が条件の案を外す必要はなくなりましたね。映像の迫力を優先するより、補足を作品に結びつけて残せることを選びたいです。"},{"speaker":"M","text":"分かりました。その条件を満たす案で進めましょう。"},{"speaker":"N","text":"二人が選ぶ案はどれですか。"},{"speaker":"N","text":"1、乙案","choice":1},{"speaker":"N","text":"2、丙案","choice":2},{"speaker":"N","text":"3、丁案","choice":3},{"speaker":"N","text":"4、甲案","choice":4}]},"N1-L-0310@1":{"uid":"N1-L-0310","revision":1,"audio":"audio/course2026_n1_L0310_v1.mp3","script":[{"speaker":"N","text":"大学で、職員が四つの相談窓口の試行案を説明しています。そのあと、責任者二人が話しています。"},{"speaker":"F","text":"甲案は予約制で一回三十分、相談内容を事前に分類して専門担当につなぎます。乙案は予約不要で短時間の聞き取りを行い、その場で内容を整理してから担当につなぎます。丙案は予約不要ですが、受付時に相談者自身が専門分野を選び、その窓口へ直接進みます。丁案は書面で質問を受け付け、翌週まとめて回答します。甲案と丙案は、扱う分野が決まっている相談に向いています。乙案は初期の聞き取りに職員が必要です。丁案は対面の職員を増やさず運用できます。"},{"speaker":"M","text":"今回来てほしいのは、自分の困り事を何の分野として相談すればよいか分からない学生です。事前に内容を書き分けてもらう方法では、入口で止まってしまいかねません。"},{"speaker":"F","text":"予約を取る段階でもためらう人がいますね。職員を増やさないことを条件にすると、丁案になるのですが、答えを急ぐ相談も想定しています。"},{"speaker":"M","text":"人員の問題は、専門の担当を全て受付に置くのではなく、最初に話を整理する職員を一人確保することで対応できそうです。"},{"speaker":"F","text":"それなら、予約や分野の自己選択を求めず、まず話を受け止める案が選べますね。専門的な回答は、その後の担当につなぐ形にしましょう。"},{"speaker":"N","text":"二人は、どの試行案を採用しますか。"},{"speaker":"N","text":"1、丁案","choice":1},{"speaker":"N","text":"2、甲案","choice":2},{"speaker":"N","text":"3、乙案","choice":3},{"speaker":"N","text":"4、丙案","choice":4}]},"N2-L-0001@2":{"uid":"N2-L-0001","revision":2,"audio":"audio/n2_q1_01.mp3","script":[{"speaker":"N","text":"会社で、女の人と男の人が話しています。男の人は、このあとまず何をしますか。"},{"speaker":"F","text":"明日の会議の資料ですが、印刷はもう終わりましたか。"},{"speaker":"M","te "M","text":"本を読んでも、読み終えたとたんに中身を忘れてしまう。だから自分は読書に向いていないんじゃないか。そんな声をよく聞きます。たしかに、せっかく時間をかけて読んだのに、半年たって内容を説明できないとなると、もったいない気もしますよね。それで、読む速さを上げようとしたり、線を引いて記録を残そうとしたりする方が多いんです。ただ、私はそこにこだわりすぎなくていいと思っています。人の記憶というのは、細かい言葉ではなく、そのとき自分が何を感じたかという形で残るものです。本の一行一行は消えても、読む前の自分なら気づかなかったことに、読んだあとの自分は気づくようになる。それこそが読書で起きている変化です。覚えていないから無駄だった、とは考えないでいただきたいんです。"},{"speaker":"N","text":"男の人が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、読む本の数を増やすことが大切だ","choice":1},{"speaker":"N","text":"に、読んだ内容は記録に残すべきだ","choice":2},{"speaker":"N","text":"さん、内容を忘れても読書には意味がある","choice":3},{"speaker":"N","text":"よん、本はできるだけ速く読んだほうがいい","choice":4}]},"N2-L-0062@2":{"uid":"N2-L-0062","revision":2,"audio":"audio/course2026_n2_L0062_v2.mp3","script":[{"speaker":"N","text":"講演会で、女の人が話しています。"},{"speaker":"F","text":"職場で小さなミスが起きたとき、皆さんの会社ではどうされているでしょうか。多くの場合、まず個人の不注意が問題にされます。気をつけましょう、確認を二回にしましょう、といった話で終わってしまう。ですが、注意を呼びかけるだけでミスが減った職場を、私はほとんど見たことがありません。人は疲れますし、忙しければ手順も飛ばします。それよりも効果があるのは、ミスをした本人が、すぐに、しかも安心して周りに言える状態を作っておくことです。早く分かれば手も打てますし、同じところでつまずいた人が何人もいると分かれば、仕組みのほうを直せます。責任を追及される場だと感じさせた時点で、情報は上がってこなくなります。まずはそこから変えていただきたいのです。"},{"speaker":"N","text":"女の人は、何について話していますか。"},{"speaker":"N","text":"いち、責任の所在をはっきりさせる方法","choice":1},{"speaker":"N","text":"に、失敗を隠さない職場の作り方","choice":2},{"speaker":"N","text":"さん、社員研修の内容を決める手順","choice":3},{"speaker":"N","text":"よん、事故が起きたときの報告の書式","choice":4}]},"N2-L-0063@2":{"uid":"N2-L-0063","revision":2,"audio":"audio/course2026_n2_L0063_v2.mp3","script":[{"speaker":"N","text":"会社の朝礼で、男の人が話しています。"},{"speaker":"M","text":"おはようございます。来週の月曜から、席を決めない働き方を始めます。朝来たら空いている机を使い、帰るときに私物を片づける。それだけです。机の上がきれいになるとか、掃除がしやすくなるとか、そういう話も出ていますが、それはついでに起きることであって、ねらいではありません。私が期待しているのは別のところです。今、同じ課の人とばかり話していて、隣の課が何をしているのかよく知らない、という声をあちこちで聞きます。席が毎日変われば、隣に座る人も変わります。そこで交わすひとことから、仕事の抜けが見つかったり、頼み事がしやすくなったりする。そのために席を動かすのだと思ってください。書類の整理は、そのついでで結構です。"},{"speaker":"N","text":"男の人は、何を伝えようとしていますか。"},{"speaker":"N","text":"いち、机の上を片づける必要があること","choice":1},{"speaker":"N","text":"に、書類の量を今より減らしてほしいこと","choice":2},{"speaker":"N","text":"さん、部署をこえて話す機会を増やすこと","choice":3},{"speaker":"N","text":"よん、席を早く取りに来てほしいこと","choice":4}]},"N2-L-0064@3":{"uid":"N2-L-0064","revision":3,"audio":"audio/course2026_n2_L0064_v3.mp3","script":[{"speaker":"N","text":"大学の授業で、女の先生が話しています。"},{"speaker":"F","text":"来月の発表について話しておきます。毎年この時期になると、スライドの背景の色をどうするか、図を何枚入れるか、といった質問がたくさん来ます。もちろん見やすさは大事です。でも、そこに時間をかけたわりに伝わらなかった、という発表を私は何度も見てきました。理由ははっきりしていて、自分が調べた順番のまま話しているからです。聞いている人は、あなたが何時間かけたかには関心がありません。知りたいのは、それで結局何が分かったのか、自分の考えとどう違うのか、その二つだけです。ですから準備はまず、聞き手が最初に浮かべる疑問を三つ書き出すところから始めてください。色や図を選ぶのは、そのあとで十分間に合います。"},{"speaker":"N","text":"先生が一番言いたいことは何ですか。"},{"speaker":"N","text":"いち、聞き手の知りたいことを考えるべきだ","choice":1},{"speaker":"N","text":"に、発表の練習の回数をもっと増やすべきだ","choice":2},{"speaker":"N","text":"さん、図を多く入れると伝わりやすい","choice":3},{"speaker":"N","text":"よん、スライドの色を工夫するべきだ","choice":4}]},"N2-L-0065@3":{"uid":"N2-L-0065","revision":3,"audio":"audio/course2026_n2_L0065_v3.mp3","script":[{"speaker":"N","text":"駅の案内放送で、男の人が話しています。"},{"speaker":"M","text":"ご利用のお客様にお知らせいたします。当駅では、来月の一日から二十日までのあいだ、北口と南口をつなぐ地下の通路で工事を行います。この期間、地下の通路はお通りいただけません。反対側の出口へ向かわれるお客様は、いったん改札の外に出ていただき、線路の上の橋をお渡りください。歩く時間が五分ほど長くなりますので、お時間に余裕を持ってお出かけください。なお、電車の発車の時刻はふだんどおりで、工事による遅れは出ません。切符の窓口も、これまでと同じ場所で朝からご利用いただけます。自転車置き場の使い方も変わりません。お客様にはご不便をおかけいたしますが、ご協力をお願いいたします。"},{"speaker":"N","text":"男の人は、何について話していますか。"},{"speaker":"N","text":"いち、切符売り場が移る日時","choice":1},{"speaker":"N","text":"に、通路が使えなくなる期間","choice":2},{"speaker":"N","text":"さん、電車が遅れている理由","choice":3},{"speaker":"N","text":"よん、自転車置き場をなくすこと","choice":4}]},"N2-L-0066@2":{"uid":"N2-L-0066","revision":2,"audio":"audio/n2_q3_06.mp3","script":[{"speaker":"N","text":"テレビで、女の人が話しています。"},{"speaker":"F","text":"壊れた道具を自分で直す方を、最近よく見かけます。新しく買い直したほうが安いこともありますから、節約のためですか、とよく聞かれるんですね。でも、実際にやってみた方に話を伺うと、返ってくる答えはたいてい違います。ねじを外して中を開けてみると、どこがどう動いてこの形になっているのかが見えてくる。毎日使っていたのに、自分は何も知らずに使っていたんだな、と気づくそうです。そこがおもしろいのだ、と。直った道具は、直す前より愛着がわきます。値段の話でいえば、時間を考えると割に合わないことのほうが多いくらいです。それでも手を動かす人が増えているのは、安いからではなく、その時間そのものが楽しいからなんですね。"},{"speaker":"N","text":"女 日ですか。お急ぎですと、いつもより三百円高くなりますが、よろしいですか。"},{"speaker":"F","text":"うーん、三百円か…。あの、明日はお店、休みじゃないですよね。しみも、きれいに取れますか。"},{"speaker":"M","text":"明日も朝から開いておりますし、しみ抜きは普通のコースでも同じようにいたします。"},{"speaker":"F","text":"そうですか。じゃあ、普通だといつできますか。"},{"speaker":"M","text":"あさってになります。夕方でしたら、六時までお預かりできますよ。"},{"speaker":"F","text":"じゃあ、急がなくていいです。あさってでお願いします。"},{"speaker":"N","text":"女の人は、どうして急ぎのコースにしませんでしたか。"}]},"N3-L-0006@2":{"uid":"N3-L-0006","revision":2,"audio":"audio/course2026_n3_L0006_v2.mp3","script":[{"speaker":"N","text":"女の人と男の人が、旅行について話しています。男の人は、どうして車で行きますか。"},{"speaker":"F","text":"夏休み、北海道に行くって言ってたよね。飛行機で行くの？"},{"speaker":"M","text":"いや、車で行くことにしたんだ。"},{"speaker":"F","text":"え、遠いのに。飛行機のほうがずっと早いでしょ。車だと二日はかかるよ。"},{"speaker":"M","text":"うん。でも、途中でいろいろな町に寄りたくて。景色を見ながら、ゆっくり行きたいんだ。"},{"speaker":"F","text":"なるほどね。荷物をたくさん積めるのもいいね。"},{"speaker":"M","text":"それもあるけど、荷物は少ないんだ。姉は飛行機が苦手だから、電車で行くって言ってたよ。"},{"speaker":"F","text":"そうなんだ。私も今度、車で北海道の町をまわってみたいな。"},{"speaker":"N","text":"男の人は、どうして車で行きますか。"}]},"N3-L-0007@2":{"uid":"N3-L-0007","revision":2,"audio":"audio/course2026_n3_L0007_v2.mp3","script":[{"speaker":"N","text":"ラジオで、女の人が話しています。"},{"speaker":"F","text":"私は十年間、毎朝走っています。始めたころは、やせたいという理由だけでした。朝早く起きるのがつらくて、何度もやめようと思いました。でも、続けているうちに、体の調子が良くなり、夜もよく眠れるようになりました。かぜをひくことも少なくなりました。雨の日は近所を歩くだけにしていますが、それでも外に出ると気持ちがすっきりします。今では、走らないと一日が始まらない気がします。走ることは、もう私の生活の一部になっているんです。"},{"speaker":"N","text":"女の人が一番言いたいことは、何ですか。"},{"speaker":"N","text":"いち、走るとやせられるということ","choice":1},{"speaker":"N","text":"に、毎朝早く起きるつらさ","choice":2},{"speaker":"N","text":"さん、走ることが生活の一部になったこと","choice":3},{"speaker":"N","text":"よん、十年間続けた理由","choice":4}]},"N3-L-0008@2":{"uid":"N3-L-0008","revision":2,"audio":"audio/course2026_n3_L0008_v2.mp3","script":[{"speaker":"N","text":"テレビで、店の人が話しています。"},{"speaker":"M","text":"うちの店では、野菜はすべて近くの農家から仕入れています。朝早く、私が自分で畑まで受け取りに行くこともあります。スーパーより少し高いかもしれません。でも、その日の朝に取れたばかりの新鮮な野菜が並びます。形が少し悪くても、味は間違いありません。お客様には、作った人の顔が見える、安心な野菜を食べてほしいんです。ですから、値札には作った人の名前も書いています。だから、これからもこのやり方を続けていきます。"},{"speaker":"N","text":"店の人は、何について話していますか。"},{"speaker":"N","text":"いち、スーパーより少し値段が高くなってしまう理由","choice":1},{"speaker":"N","text":"に、近くのスーパーとお客を取り合う競争の激しさ","choice":2},{"speaker":"N","text":"さん、近くの農家で野菜を作っている人たちの一日","choice":3},{"speaker":"N","text":"よん、新鮮で安心な野菜を売ることへのこだわり","choice":4}]},"N3-L-0009@1":{"uid":"N3-L-0009","revision":1,"audio":"audio/n3_q3_03.mp3","script":[{"speaker":"N","text":"留守番電話に、男の人からのメッセージが入っています。"},{"speaker":"M","text":"もしもし、みどり自転車店の高山です。お預かりしている自転車の修理について、ご連絡しました。まず、タイヤの交換のほうは、今日の午前中に終わりました。ただ、ブレーキの部品が古い型で、うちの店には置いていないんです。それで工場に注文したのですが、届くのが来週の水曜日になるそうです。ブレーキは安全にとても大事なところですので、直さないままお返しすることはできません。ですので、お渡しは来週の木曜日以降にさせてください。お急ぎでしたら、もう一度お電話をください。"},{"speaker":"N","text":"男の人が一番伝えたいことは、何ですか。"},{"speaker":"N","text":"いち、自転車を受け取れるのが来週になること","choice":1},{"speaker":"N","text":"に、タイヤの交換はもう終わったこと","choice":2},{"speaker":"N","text":"さん、ブレーキは直さずに返すこと","choice":3},{"speaker":"N","text":"よん、部品が古い型で店にないこと","choice":4}]},"N3-L-0010@2":{"uid":"N3-L-0010","revision":2,"audio":"audio/course2026_n3_L0010_v2.mp3","script":[{"speaker":"N","text":"電車の中で、お年寄りが立っています。あなたは席に座っています。席をゆずりたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、よろしければ、こちらの席にどうぞ。","choice":1},{"speaker":"F","text":"に、席が空いたら、すぐにお呼びしますね。","choice":2},{"speaker":"F","text":"さん、すみません、そこに座らせてもらえませんか。","choice":3}]},"N3-L-0011@1":{"uid":"N3-L-0011","revision":1,"audio":"audio/n3_q4_02.mp3","script":[{"speaker":"N","text":"友だちに借りた本を、うっかり少し破いてしまいました。本を返すとき、正直に伝えます。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、この本、破かないように気をつけて読むね。","choice":1},{"speaker":"F","text":"に、直してくれてありがとう。助かったよ。","choice":2},{"speaker":"F","text":"さん、ごめん、読んでいるときに少し破いちゃって。","choice":3}]},"N3-L-0012@2":{"uid":"N3-L-0012","revision":2,"audio":"audio/n3_q4_03.mp3","script":[{"speaker":"N","text":"駅で、道が分からず困っている様子の人がいます。あなたは手伝いたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、すみません、駅への行き方を教えてください。","choice":1},{"speaker":"F","text":"に、すみません、ちょっと手伝ってもらえませんか。","choice":2},{"speaker":"F","te を買わないように。"},{"speaker":"M","text":"リストは紙に書けばいい？"},{"speaker":"F","text":"うん、そこのメモ帳でいいよ。書けたら見せてね。"},{"speaker":"M","text":"分かった。じゃあ先に冷蔵庫の中を見て、それからリストを書くね。"},{"speaker":"N","text":"息子は、まず何をしますか。"}]},"N3-L-0018@2":{"uid":"N3-L-0018","revision":2,"audio":"audio/course2026_n3_L0018_v2.mp3","script":[{"speaker":"N","text":"高校の事務室で、女の職員と男の職員が話しています。男の職員は、このあとまず何をしますか。"},{"speaker":"F","text":"明日の説明会だけど、体育館の準備、お願いできる？"},{"speaker":"M","text":"はい。いすを並べて、机に資料を置いておけばいいですか。"},{"speaker":"F","text":"資料はまだ印刷できていないから、そっちは私がやっておく。"},{"speaker":"M","text":"分かりました。じゃあ、いすからですね。"},{"speaker":"F","text":"あ、体育館のかぎ。守衛室で借りるんだけど、あそこの窓口、四時で閉まっちゃうの。"},{"speaker":"M","text":"え、もう三時五十分ですよ。"},{"speaker":"F","text":"そう。かぎがないと中に入れないから、間に合わなくなる。"},{"speaker":"M","text":"急ぎます。借りてきてから体育館を開けますね。"},{"speaker":"N","text":"男の職員は、このあとまず何をしますか。"}]},"N3-L-0019@1":{"uid":"N3-L-0019","revision":1,"audio":"audio/n3_q2_04.mp3","script":[{"speaker":"N","text":"電話で、男の人とレストランの店員が話しています。男の人は、どうして予約の時間を変えますか。"},{"speaker":"M","text":"すみません、今日7時に予約した田中ですが、時間を8時に変えられますか。"},{"speaker":"F","text":"はい、大丈夫ですよ。お仕事が遅くなりそうですか。七時ですと店も混み合いますので、八時のほうがゆっくりお過ごしいただけますよ。"},{"speaker":"M","text":"いえ、仕事は大丈夫なんですが、一緒に行く友だちの電車が事故で遅れているんです。"},{"speaker":"F","text":"それは大変ですね。今日は駅前の道も、とても混んでいるようですよ。"},{"speaker":"M","text":"そうなんですか。友だちは、あと一時間ほどかかると言っていました。では、八時でお願いします。"},{"speaker":"F","text":"そうですか。では、8時にお待ちしております。"},{"speaker":"N","text":"男の人は、どうして予約の時間を変えますか。"}]},"N3-L-0020@1":{"uid":"N3-L-0020","revision":1,"audio":"audio/n3_q2_05.mp3","script":[{"speaker":"N","text":"大学のテニスサークルで、男の学生と女の学生が話しています。女の学生は、どうして今日の練習を休みますか。"},{"speaker":"M","text":"あれ、今日の練習に出ないんだって？先週、のどが痛いって言ってたけど、またよくないの？"},{"speaker":"F","text":"ううん、のどはもうすっかり治ったよ。走っても平気なくらい元気。"},{"speaker":"M","text":"じゃあ、レポート？たしか、金曜が締め切りだって言ってたよね。"},{"speaker":"F","text":"それは昨日のうちに出しちゃった。実はね、妹が電車でこっちに来るの。荷物が多いから、駅まで迎えに行かないと。"},{"speaker":"M","text":"ああ、そういうことか。じゃあ、コートの片づけは、こっちでやっておくよ。"},{"speaker":"F","text":"ありがとう。来週の練習には、ちゃんと出るからね。"},{"speaker":"N","text":"女の学生は、どうして今日の練習を休みますか。"}]},"N3-L-0021@1":{"uid":"N3-L-0021","revision":1,"audio":"audio/n3_q2_06.mp3","script":[{"speaker":"N","text":"会社で、女の人と男の人が話しています。男の人は、どうして遅刻しましたか。"},{"speaker":"F","text":"田中さん、今日は遅かったですね。寝坊ですか。"},{"speaker":"M","text":"いえ、ちゃんと早く家を出たんです。でも、途中で財布を忘れたことに気づいて、取りに戻ったんです。"},{"speaker":"F","text":"ああ、それは大変でしたね。電車も遅れていたんですか。"},{"speaker":"M","text":"電車はいつもどおりでしたよ。ただ、駅までの道が、いつもより混んでいて。"},{"speaker":"F","text":"私は今朝、道に迷って、反対の駅まで歩いてしまいました。"},{"speaker":"M","text":"それも大変ですね。財布がないと、電車にも乗れませんから、戻るしかなくて。"},{"speaker":"F","text":"次からは、出かける前に確かめたほうがいいですよ。"},{"speaker":"N","text":"男の人は、どうして遅刻しましたか。"}]},"N3-L-0022@3":{"uid":"N3-L-0022","revision":3,"audio":"audio/course2026_n3_L0022_v3.mp3","script":[{"speaker":"N","text":"図書館で、係の人と学生が話しています。"},{"speaker":"F","text":"初めてのご利用ですね。では、はじめにお願いです。館内では、静かにお願いします。また、本を読む席では、食べたり飲んだりしないでください。本を汚してしまうことがあります。"},{"speaker":"M","text":"水も飲めないんですか。勉強していると、のどがかわいてしまって。"},{"speaker":"F","text":"ふたのついた容器に入れた水でしたら、一階の入口にある休けい所でお飲みいただけます。かばんに入れて持ち歩くのはかまいません。それから、借りた本は、一人五冊まで、二週間以内に返してください。"},{"speaker":"M","text":"読み終わらなかったら、どうすればいいですか。"},{"speaker":"F","text":"もし遅れそうなときは、電話で連絡していただければ、期間をのばすことができます。"},{"speaker":"M","text":"分かりました。気をつけます。"},{"speaker":"N","text":"係の人は、何について話していますか。"},{"speaker":"N","text":"いち、図書館を利用するときの決まり","choice":1},{"speaker":"N","text":"に、公共の場所でのマナー全般","choice":2},{"speaker":"N","text":"さん、本を返す日の変え方","choice":3},{"speaker":"N","text":"よん、飲み物を飲んでよい場所","choice":4}]},"N3-L-0023@2":{"uid":"N3-L-0023","revision":2,"audio":"audio/course2026_n3_L0023_v2.mp3","script":[{"speaker":"N","text":"女の人が話しています。"},{"speaker":"F","text":"私は先月、初めて一人で旅行に行きました。友だちの都合が合わなくて、思い切って一人で決めたんです。最初は不安でした。でも、行ってみると、自分で全部決められるのがとても楽しかったです。食べたいものを食べて、疲れたらすぐ宿に戻る。だれにも合わせなくていいんですね。道が分からないときは、地元の人に聞いて、いろいろな人と話すこともできました。一人旅は、さびしいと思っていましたが、思っていたよりずっといい経験でした。"},{"speaker":"N","text":"女の人が一番言いたいことは、何ですか。"},{"speaker":"N","text":"いち、一人旅は思ったよりよい経験だったこと","choice":1},{"speaker":"N","text":"に、知らない町で迷った話","choice":2},{"speaker":"N","text":"さん、一人で行くと決めるまでの迷い","choice":3},{"speaker":"N","text":"よん、旅行に行く前の大きな不安","choice":4}]},"N3-L-0024@1":{"uid":"N3-L-0024","revision":1,"audio":"audio/n3_q3_06.mp3","script":[{"speaker":"N","text":"学校で、先生が話しています。"},{"speaker":"M","text":"今日の宿題について説明します。教科書の50ページを読んで、分からない言葉を調べてきてください。ノートの右側に、意味と短い例文を書いておくといいですよ。全部覚える必要はありません。大切なのは、自分で調べる習慣をつけることです。インターネットでもかまいませんが、意味が一つだけとは限りません。友だちの答えを写すだけでは、力はつきません。少し時間がかかっても、まずは自分で辞書を引いてみてください。来週の授業では、調べた言葉を使って短い文を作ってもらいます。"},{"speaker":"N","text":"先生が一番伝えたいことは、何ですか。"},{"speaker":"N","text":"いち、宿題を早く終わらせてしまうこと","choice":1},{"speaker":"N","text":"に、分からない言葉を全部覚えてしまうこと","choice":2},{"speaker":"N","text":"さん、辞書で調べた意味をノートに写すこと","choice":3},{"speaker":"N","text":"よん、自分で調べる習慣をつけること","choice":4}]},"N3-L-0025@2":{"uid":"N3-L-0025","revision":2,"audio":"audio/course2026_n3_L0025_v2.mp3","script":[{"speaker":"N","text":"授業中、ペンを忘れました。となりの友だちから借りたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、ペン、貸してくれてありがとう。","choice":1},{"speaker":"F","text":"に、ごめん、ペンを忘れて。一本貸してくれない？","choice":2},{"speaker":"F","text":"さん、ペンが足りないなら、これを使っていいよ。","choice":3}]},"N3-L-0026@1":{"uid":"N3-L-0026","revision":1,"audio":"audio/n3_q4_05.mp3","script":[{"speaker":"N","text":"会議に少し遅れてしまいました。部屋に入るとき、何と言いますか。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、遅くなって申し訳ありません。失礼します。","choice":1},{"speaker":"F","text":"に、では、そろそろ会議を始めましょうか。","choice":2},{"speaker":"F","text":"さん、遅れるなら連絡してくださいよ。","choice":3}]},"N3-L-0027@1":{"uid":"N3-L-0027","revision":1,"audio":"audio/n3_q4_06.mp3","script":[{"speaker":"N","text":"服の店で、気に入ったシャツがありました。着てみたいです。店員に何と言いますか。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、よろしければ、着てみてくださいませ。","choice":1},{"speaker":"F","text":"に、サイズが合わなかったので返品します。","choice":2},{"speaker":"F","text":"さん、すみません、これを試着してもいいですか。","choice":3}]},"N3-L-0028@1":{"uid":"N3-L-0028","revision":1,"audio":"audio/n3_q5_04.mp3","script":[{"speaker":"M","text":"さっきは、重い荷物、運んでくれてありがとう。助かったよ。"},{"speaker":"F","text":"いち、そちらをお願いします。","choice":1},{"speaker":"F","text":"に、いいえ、どういたしまして。","choice":2},{"speaker":"F","text":"さん、これから運びます。","choice":3}]},"N3-L-0029@2":{"uid":"N3-L-0029","revision":2,"audio":"audio/n3_q5_05.mp3","script":[{"speaker":"F","text":"ねえ、もうお昼だね。よかったら、一緒にお昼ごはんを食べに行かない？"},{"speaker":"M","text":"いち、うん、いいね。行こう。","choice":1},{"speaker":"M","text":"に、お昼ごはんの店はどこにあるの？","choice":2},{"speaker":"M","text":"さん、うん、あの店のパンはおいしいよ。","choice":3}]},"N3-L-0030@1":{"uid":"N3-L-0030","revision":1,"audio":"audio/n3_q5_06.mp3","script":[{"speaker":"F","text":"うちの木の枝、お宅の駐車場まで伸びていませんか。切りましょうか。"},{"speaker":"M","text":"いち、木が大きいですね。","choice":1},{"speaker":"M","text":"に、そうですね、お願いできますか。","choice":2},{"speaker":"M","text":"さん、ええ、うちの木も大きくなりました。","choice":3}]},"N3-L-0031@1":{"uid":"N3-L-0031","revision":1,"audio":"audio/n3_q5_07.mp3","script":[{"speaker":"F","text":"今度の日曜、町内の公園そうじがあるんですが、出られますか。"},{"speaker":"M","text":"いち、はい、朝から参加できます。","choice":1},{"speaker":"M","text":"に、先週済ませました。","choice":2},{"speaker":"M","text":"さん、あの公園は広いですよね。","choice":3}]},"N3-L-0032@1":{"uid":"N3-L-0032","revision":1,"audio":"audio/n3_q5_08.mp3","script":[{"speaker":"M","text":"送っていただいた添付ファイル、こちらでは開けないんですが。"},{"speaker":"F","text":"いち、こちらでは開けますが。","choice":1},{"speaker":"F","text":"に、では、別の形式で送り直します。","choice":2},{"speaker":"F","text":"さん、そちらにも送ってください。","choice":3}]},"N3-L-0033@2":{"uid":"N3-L-0033","revision":2,"audio":"audio/course2026_n3_L0033_v2.mp3","script":[{"speaker":"F","text":"あのう、すみません、この席、空いていますか。"},{"speaker":"M","text":"いち、では、私が座ります。","choice":1},{"speaker":"M","text":"に、ええ、どうぞ。","choice":2},{"speaker":"M","text":"さん、こちらこそ。","choice":3}]},"N3-L-0034@1":{"uid":"N3-L-0034","revision":1,"audio":"audio/n3_q5_10.mp3","script":[{"speaker":"F","text":"ちょっと暑いんですが、窓を開けてもいいですか。"},{"speaker":"M","text":"いち、ええ、どうぞ。","choice":1},{"speaker":"M","text":"に、開けました。","choice":2},{"speaker":"M","text":"さん、二つです。","choice":3}]},"N3-L-0035@4":{"uid":"N3-L-0035","revision":4,"audio":"audio/course2026_n3_L0035_v3.mp3","script":[{"speaker":"F","text":"よかったら、コーヒー、もう一杯いかがですか。"}, N","text":"会社で、社長が新入社員に話しています。"},{"speaker":"M","text":"仕事では、失敗することもあります。私も若いころ、大切な書類の日付を間違えて、お客様に迷惑をかけたことがあります。でも、失敗そのものより、そのあとどうするかが大切です。失敗したら、なぜそうなったのかを考え、次に同じことをしないようにする。一人で困っているより、周りの人に相談したほうが早いこともあります。それができる人が、少しずつ成長していきます。だから、失敗を怖がらないでください。"},{"speaker":"N","text":"社長が一番言いたいことは、何ですか。"},{"speaker":"N","text":"いち、だれよりも早く成長すること","choice":1},{"speaker":"N","text":"に、失敗をしてはいけないということ","choice":2},{"speaker":"N","text":"さん、失敗のあとの行動が大切だということ","choice":3},{"speaker":"N","text":"よん、失敗をすぐ報告すること","choice":4}]},"N3-L-0082@2":{"uid":"N3-L-0082","revision":2,"audio":"audio/course2026_n3_L0082_v2.mp3","script":[{"speaker":"N","text":"ラジオで、男の人が町について話しています。"},{"speaker":"M","text":"私の町では、五年前から、みんなで花を植える活動を続けています。駅の前や公園に、季節ごとの花を植えるんです。春はチューリップ、秋はコスモスというように、その季節に合った花を選びます。始めたころは数人でしたが、今では子どもからお年寄りまで、たくさんの人が参加しています。夏の暑い時期の水やりは、近所の人が朝と夕方に交代で行っています。花のおかげで町が明るくなり、住む人どうしの会話も増えました。"},{"speaker":"N","text":"男の人は、主に何について話していますか。"},{"speaker":"N","text":"いち、季節ごとの花のじょうずな育て方","choice":1},{"speaker":"N","text":"に、町でみんなが花を植える活動","choice":2},{"speaker":"N","text":"さん、駅の前に新しくできた建物について","choice":3},{"speaker":"N","text":"よん、夏の水やりを近所の人が交代でしていること","choice":4}]},"N3-L-0083@1":{"uid":"N3-L-0083","revision":1,"audio":"audio/n3_q5_31.mp3","script":[{"speaker":"F","text":"お預かりした時計ですが、直すのに二週間ほどかかります。"},{"speaker":"M","text":"いち、もう直していただきました。","choice":1},{"speaker":"M","text":"に、では、待ちますのでお願いします。","choice":2},{"speaker":"M","text":"さん、父の時計なんです。","choice":3}]},"N3-L-0084@1":{"uid":"N3-L-0084","revision":1,"audio":"audio/n3_q5_32.mp3","script":[{"speaker":"F","text":"確認なんですが、この書類、コピーは何部いりますか。"},{"speaker":"M","text":"いち、書類はあちらにございます。","choice":1},{"speaker":"M","text":"に、はい、コピーしました。","choice":2},{"speaker":"M","text":"さん、五部お願いします。","choice":3}]},"N3-L-0085@2":{"uid":"N3-L-0085","revision":2,"audio":"audio/n3_q5_33.mp3","script":[{"speaker":"F","text":"となりの部屋の者ですが、すみません、少し静かにしていただけますか。"},{"speaker":"M","text":"いち、あ、失礼しました。","choice":1},{"speaker":"M","text":"に、うるさいです。","choice":2},{"speaker":"M","text":"さん、二階のほうが静かです。","choice":3}]},"N3-L-0086@1":{"uid":"N3-L-0086","revision":1,"audio":"audio/n3_q5_34.mp3","script":[{"speaker":"M","text":"先ほどお電話いただいたエアコンの件、明日うかがえますが。"},{"speaker":"F","text":"いち、修理は大変なお仕事ですね。","choice":1},{"speaker":"F","text":"に、うん、じゃあ明日ね、待ってるよ。","choice":2},{"speaker":"F","text":"さん、では、午前中にお願いします。","choice":3}]},"N3-L-0087@2":{"uid":"N3-L-0087","revision":2,"audio":"audio/n3_q5_35.mp3","script":[{"speaker":"F","text":"ねえ、一口食べてみて。この料理、ちょっと辛すぎない？"},{"speaker":"M","text":"いち、この料理の店、駅の近くにできたよ。","choice":1},{"speaker":"M","text":"に、この料理、ぼくが作ったんだよ。","choice":2},{"speaker":"M","text":"さん、うん、水を持ってこようか。","choice":3}]},"N3-L-0088@1":{"uid":"N3-L-0088","revision":1,"audio":"audio/n3_q5_36.mp3","script":[{"speaker":"F","text":"今日はここまでにしましょう。来週までに三ページ進めてきてください。"},{"speaker":"M","text":"いち、はい、家でやってきます。","choice":1},{"speaker":"M","text":"に、うん、わかった、やっとくよ。","choice":2},{"speaker":"M","text":"さん、先週もう三ページやりました。","choice":3}]},"N3-L-0089@1":{"uid":"N3-L-0089","revision":1,"audio":"audio/n3_q5_37.mp3","script":[{"speaker":"F","text":"体験レッスンは無料ですので、来週いらっしゃいませんか。"},{"speaker":"M","text":"いち、じゃあ、水曜に行ってみます。","choice":1},{"speaker":"M","text":"に、水着は自分で買うんですね。","choice":2},{"speaker":"M","text":"さん、体験は無料でしょうか。","choice":3}]},"N3-L-0090@2":{"uid":"N3-L-0090","revision":2,"audio":"audio/n3_q5_38.mp3","script":[{"speaker":"M","text":"あしたのお祭り、終わったあとの片づけを手伝ってくれない？"},{"speaker":"F","text":"いち、うん、最後まで残れるよ。","choice":1},{"speaker":"F","text":"に、お祭りは六時からだったよね。","choice":2},{"speaker":"F","text":"さん、片づけって大変そうだよね。","choice":3}]},"N3-L-0091@1":{"uid":"N3-L-0091","revision":1,"audio":"audio/n3_q5_39.mp3","script":[{"speaker":"F","text":"あのう、すみません、ここ、写真をとってもいいですか。"},{"speaker":"M","text":"いち、いいえ、これはカメラですね。","choice":1},{"speaker":"M","text":"に、はい、さっきここで写真を写しました。","choice":2},{"speaker":"M","text":"さん、すみません、ここは禁止なんです。","choice":3}]},"N3-L-0092@1":{"uid":"N3-L-0092","revision":1,"audio":"audio/n3_q5_40.mp3","script":[{"speaker":"F","text":"この荷物ですと、速達で明日の午前中にお届けできますが。"},{"speaker":"M","text":"いち、切手も買えますか。","choice":1},{"speaker":"M","text":"に、へえ、早いんだ。それでいいや。","choice":2},{"speaker":"M","text":"さん、じゃあ、速達でお願いします。","choice":3}]},"N3-L-0093@2":{"uid":"N3-L-0093","revision":2,"audio":"audio/n3_q5_41.mp3","script":[{"speaker":"F","text":"田村さん、おつかれさま。今日の発表、とてもよかったよ。"},{"speaker":"M","text":"いち、発表の会場でしたら、あちらの部屋になります。","choice":1},{"speaker":"M","text":"に、ありがとうございます。緊張しました。","choice":2},{"speaker":"M","text":"さん、はい、わたしは今日の午前に発表しました。","choice":3}]},"N3-L-0094@1":{"uid":"N3-L-0094","revision":1,"audio":"audio/n3_q5_42.mp3","script":[{"speaker":"F","text":"さっき曲がったけど、この道でいいのかな。地図ある？"},{"speaker":"M","text":"いち、この道は去年できたばかりだよ。","choice":1},{"speaker":"M","text":"に、ううん、駅はもう近いよ。","choice":2},{"speaker":"M","text":"さん、うん、スマホで調べてみるよ。","choice":3}]},"N3-L-0095@1":{"uid":"N3-L-0095","revision":1,"audio":"audio/n3_q5_43.mp3","script":[{"speaker":"F","text":"お待たせしました。お客様、お会計は別々になさいますか。"},{"speaker":"M","text":"いち、いえ、一緒でお願いします。","choice":1},{"speaker":"M","text":"に、さっき食べました。","choice":2},{"speaker":"M","text":"さん、いいえ、これはお金です。","choice":3}]},"N3-L-0096@1":{"uid":"N3-L-0096","revision":1,"audio":"audio/n3_q5_44.mp3","script":[{"speaker":"F","text":"ねえ、ずっと思ってたけど、エアコン、寒くない？"},{"speaker":"M","text":"いち、うん、少し温度を上げようか。","choice":1},{"speaker":"M","text":"に、うん、これが新しいエアコンだよ。","choice":2},{"speaker":"M","text":"さん、エアコンの音、少し大きい気がするね。","choice":3}]},"N3-L-0097@2":{"uid":"N3-L-0097","revision":2,"audio":"audio/course2026_n3_L0097_v2.mp3","script":[{"speaker":"M","text":"あしたの朝練、六時集合だから、寝坊しないでよ。"},{"speaker":"F","text":"いち、何時集合ですか。","choice":1},{"speaker":"F","text":"に、はい、目覚まし三つかけます。","choice":2},{"speaker":"F","text":"さん、昨日の練習はきつかったです。","choice":3}]},"N3-L-0098@1":{"uid":"N3-L-0098","revision":1,"audio":"audio/n3_q5_46.mp3","script":[{"speaker":"F","text":"確認したいんだけど、レポート、締め切りはいつまで？"},{"speaker":"M","text":"いち、もう出したよ。","choice":1},{"speaker":"M","text":"に、レポートはあちら。","choice":2},{"speaker":"M","text":"さん、来週の月曜までだよ。","choice":3}]},"N3-L-0099@1":{"uid":"N3-L-0099","revision":1,"audio":"audio/ t":"店で買ったものを、袋に入れてほしいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、袋に入れていただき、助かりました。","choice":1},{"speaker":"F","text":"に、すみません、これ袋に入れてもらえますか。","choice":2},{"speaker":"F","text":"さん、袋にお入れしますので、少々お待ちください。","choice":3}]},"N3-L-0106@2":{"uid":"N3-L-0106","revision":2,"audio":"audio/course2026_n3_L0106_v2.mp3","script":[{"speaker":"N","text":"友だちの発表がとても上手でした。ほめます。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、ありがとう。うまく話せるか心配だったよ。","choice":1},{"speaker":"F","text":"に、さっきの発表、すごくよかったよ。","choice":2},{"speaker":"F","text":"さん、発表、これからだよね。がんばってね。","choice":3}]},"N3-L-0107@1":{"uid":"N3-L-0107","revision":1,"audio":"audio/n3_q4_27.mp3","script":[{"speaker":"N","text":"銀行の窓口に来ました。新しく口座を作りたいので、必要な物を係の人に聞きます。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、ねえ、口座作りたいんだけど何が要るの。","choice":1},{"speaker":"F","text":"に、身分証明書とはんこをお持ちでしょうか。","choice":2},{"speaker":"F","text":"さん、口座を作りたいのですが、何が必要でしょうか。","choice":3}]},"N3-L-0108@1":{"uid":"N3-L-0108","revision":1,"audio":"audio/n3_q4_28.mp3","script":[{"speaker":"N","text":"友だちの家におじゃまして、帰るときです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、おじゃまします。よんでくれてありがとう。","choice":1},{"speaker":"F","text":"に、ただいま。思ったより早く帰れたよ。","choice":2},{"speaker":"F","text":"さん、今日はごちそうさま。おじゃましました。","choice":3}]},"N3-L-0109@1":{"uid":"N3-L-0109","revision":1,"audio":"audio/n3_q4_29.mp3","script":[{"speaker":"N","text":"電車の中で、前の人がハンカチを落としました。教えてあげます。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、あのう、それわたしのハンカチですが。","choice":1},{"speaker":"F","text":"に、これ、使わないならもらえますか。","choice":2},{"speaker":"F","text":"さん、すみません、ハンカチを落とされましたよ。","choice":3}]},"N3-L-0110@1":{"uid":"N3-L-0110","revision":1,"audio":"audio/n3_q4_30.mp3","script":[{"speaker":"N","text":"レストランで、注文と違う料理が来ました。店員に言います。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、ごちそうさまでした。おいしいですね。","choice":1},{"speaker":"F","text":"に、すみません、これはたのんだ物と違います。","choice":2},{"speaker":"F","text":" :"さん、部長が新人だったころの思い出","choice":3},{"speaker":"N","text":"よん、新入社員が入る日の知らせ","choice":4}]},"N3-L-0166@2":{"uid":"N3-L-0166","revision":2,"audio":"audio/course2026_n3_L0166_v2.mp3","script":[{"speaker":"N","text":"店で、店員がアナウンスをしています。"},{"speaker":"F","text":"ご来店ありがとうございます。当店では、来月から、レジ袋が有料になります。一枚三円です。レジでお申しつけくださったお客様だけに、お渡しいたします。買い物袋をお持ちの方は、ぜひご利用ください。地球の環境を守るための取り組みです。当店では、これまでも、商品の包みを少なくする活動を続けてまいりました。なお、今月中は、これまでどおり、無料でお渡しいたします。くり返しになりますが、来月一日からの実施でございます。ご協力をお願いいたします。"},{"speaker":"N","text":"店員は、主に何について話していますか。"},{"speaker":"N","text":"いち、来月から始まる店のセールの日","choice":1},{"speaker":"N","text":"に、地球の環境を守るための取り組み全体","choice":2},{"speaker":"N","text":"さん、レジ袋が有料になること","choice":3},{"speaker":"N","text":"よん、商品の包みを少なくする活動","choice":4}]},"N3-L-0167@3":{"uid":"N3-L-0167","revision":3,"audio":"audio/course2026_n3_L0167_v3.mp3","script":[{"speaker":"N","text":"ラジオで、男の人が話しています。"},{"speaker":"M","text":"私は毎週、近所の公園のそうじに参加しています。日曜の朝七時に集まって、一時間ほど、落ち葉や空きかんを拾います。始めたころは、正直、面倒だと思っていました。でも、続けているうちに、公園がきれいになるのがうれしくなってきました。それに、同じように参加している人たちと、いつのまにか友だちになりました。先週は、そうじのあとで、みんなでお茶を飲みながら、長い間話をしました。今では、日曜の朝が楽しみです。"},{"speaker":"N","text":"男の人が一番言いたいことは、何ですか。"},{"speaker":"N","text":"いち、公園のそうじを続けてよかったこと","choice":1},{"speaker":"N","text":"に、そうじ仲間と友だちになる方法","choice":2},{"speaker":"N","text":"さん、そうじのあとでみんなでお茶を飲む楽しさ","choice":3},{"speaker":"N","text":"よん、公園でごみを拾う人の集まる時間","choice":4}]},"N3-L-0168@2":{"uid":"N3-L-0168","revision":2,"audio":"audio/course2026_n3_L0168_v2.mp3","script":[{"speaker":"N","text":"テレビで、料理の先生と男の人が話しています。"},{"speaker":"M","text":"先生、今日はどんなお話でしょうか。"},{"speaker":"F","text":"今日は、おいしいごはんをたくお話です。ポイントは、お米を洗ったあと、すぐにたかないことです。"},{"speaker":"M","text":"洗って、そのまますぐにたいてはいけないんですね。"},{"speaker":"F","text":"ええ。水につけて、三十分ほど置いてください。お米が水をよく吸って、ふっくらとおいしくたけます。"},{"speaker":"M","text":"冬のように、水が冷たい日も同じでいいですか。"},{"speaker":"F","text":"冬は、水が冷たいので、少し長めに、一時間ほど置くといいですよ。夏なら、三十分で十分です。"},{"speaker":"M","text":"たった三十分待つだけで、そんなに変わるものですか。"},{"speaker":"F","text":"少し待つだけで、味が変わりますよ。ぜひためしてみてください。"},{"speaker":"N","text":" ","choice":4}]},"N3-L-0237@1":{"uid":"N3-L-0237","revision":1,"audio":"audio/course2026_n3_L0237_v1.mp3","script":[{"speaker":"N","text":"会社で、先輩が新人に話しています。"},{"speaker":"M","text":"質問するとき、何も分からないとだけ言うと、相手もどこから説明すればよいか迷います。ここまではできましたが、この先が分かりません、と伝えてみてください。できているところを見せれば、同じ説明を最初から聞かなくて済みます。質問するのは悪いことではありません。自分がどこで止まったのかを伝えることも、仕事の大切な部分です。"},{"speaker":"N","text":"先輩が一番伝えたいことは何ですか。"},{"speaker":"N","text":"1、質問せずに最後まで一人で行うこと","choice":1},{"speaker":"N","text":"2、説明を最初から繰り返してもらうこと","choice":2},{"speaker":"N","text":"3、仕事を早く終えるため質問を省くこと","choice":3},{"speaker":"N","text":"4、分からなくなった箇所を具体的に示すこと","choice":4}]},"N3-L-0238@1":{"uid":"N3-L-0238","revision":1,"audio":"audio/course2026_n3_L0238_v1.mp3","script":[{"speaker":"N","text":"ラジオで、女の人が話しています。"},{"speaker":"F","text":"私は買い物に行く前、買う物の名前だけでなく、家にある物もメモします。前は、安いと聞くと、まだ残っている物まで買ってしまいました。今は、そのメモを見ると、買わなくてよい物が分かります。安く買えたかどうかより、買った物を最後まで使えたかどうかを考えるようになりました。買い物の工夫は、お店へ行く前から始まっているんですね。"},{"speaker":"N","text":"女の人は何について話していますか。"},{"speaker":"N","text":"1、家にある物を把握して無駄な買い物を減らす工夫","choice":1},{"speaker":"N","text":"2、安売りの店を探す方法","choice":2},{"speaker":"N","text":"3、同じ品物を大量に買う利点","choice":3},{"speaker":"N","text":"4、買った物の値段を毎日比べる習慣","choice":4}]},"N3-L-0239@1":{"uid":"N3-L-0239","revision":1,"audio":"audio/course2026_n3_L0239_v1.mp3","script":[{"speaker":"N","text":"地域の写真クラブで、男の人が話しています。"},{"speaker":"M","text":"写真を撮るのが好きになったのは、新しいカメラを買ったときではありません。毎朝通る道で、同じ木を撮り続けたときです。葉の色だけでなく、影の長さや、道を歩く人の服も変わっていました。特別な場所へ行かなくても、見方を変えると発見があります。上手に撮ろうとする前に、いつもの景色を、もう一度よく見てみてください。"},{"speaker":"N","text":"男の人が伝えたいことは何ですか。"},{"speaker":"N","text":"1、遠い撮影場所へ行く楽しさ","choice":1},{"speaker":"N","text":"2、身近な景色を見直すと発見できること","choice":2},{"speaker":"N","text":"3、人物を写さず木だけを撮る規則","choice":3},{"speaker":"N","text":"4、高価なカメラを選ぶ必要性","choice":4}]},"N3-L-0240@1":{"uid":"N3-L-0240","revision":1,"audio":"audio/course2026_n3_L0240_v1.mp3","script":[{"speaker":"N","text":"料理教室で、先生が話しています。"},{"speaker":"F","text":"最初から調味料を全部入れないでください。同じ分量で作っても、野菜の大きさや水分で、味の感じ方が変わります。薄ければ、あとから足せますが、濃くなった味を戻すのは簡単ではありません。数字だけを見て作るのではなく、途中で確かめることが大切です。慣れてきたら、自分の家でいつも使う鍋でも、同じように試してみましょう。"},{"speaker":"N","text":"先生は、なぜ少しずつ味を付けるよう勧めていますか。"},{"speaker":"N","text":"1、鍋を新しく買い替えるため","choice":1},{"speaker":"N","text":"2、調味料を全く使わないため","choice":2},{"speaker":"N","text":"3、濃くしすぎず、確かめながら調整するため","choice":3},{"speaker":"N","text":"4、野菜を同じ大きさにするため","choice":4}]},"N3-L-0241@1":{"uid":"N3-L-0241","revision":1,"audio":"audio/course2026_n3_L0241_v1.mp3","script":[{"speaker":"N","text":"大学で、学生が後輩に話しています。"},{"speaker":"M","text":"分からない言葉に全部線を引くと、本が線だらけになってしまいます。僕は、まず、一つの段落を最後まで読みます。それから、同じ言葉が何度も出てきたり、その言葉が分からないと話がつながらなかったりするときに調べます。何でもすぐ調べるより、文章の中で何が大事かを考える練習になりました。辞書を使わないということではありません。使うタイミングを変えるんです。"},{"speaker":"N","text":"学生が勧めている勉強方法はどれですか。"},{"speaker":"N","text":"1、全ての語を最初に辞書で調べる","choice":1},{"speaker":"N","text":"2、分からない語を全て無視する","choice":2},{"speaker":"N","text":"3、文章を読まず単語だけ覚える","choice":3},{"speaker":"N","text":"4、文章の流れを見て必要な語を調べる","choice":4}]},"N3-L-0242@1":{"uid":"N3-L-0242","revision":1,"audio":"audio/course2026_n3_L0242_v1.mp3","script":[{"speaker":"N","text":"町の清掃活動で、担当者が話しています。"},{"speaker":"F","text":"今年から、活動の最後に、拾ったごみの種類を少しだけ記録しています。量を競うためではありません。どこで、何が多く捨てられるのかを知りたいのです。飲み物の容器が多い場所では、近くの店にも相談してみるつもりです。拾ってきれいにするだけでなく、どうしたら次のごみを減らせるかまで考えて、活動を続けたいと思っています。"},{"speaker":"N","text":"担当者が重視していることは何ですか。"},{"speaker":"N","text":"1、記録を使い、ごみが出る原因や減らす方法を考えること","choice":1},{"speaker":"N","text":"2、参加者の成績を量で決めること","choice":2},{"speaker":"N","text":"3、毎回同じ場所だけを掃除すること","choice":3},{"speaker":"N","text":"4、ごみを拾う活動をやめること","choice":4}]},"N3-L-0243@1":{"uid":"N3-L-0243","revision":1,"audio":"audio/course2026_n3_L0243_v1.mp3","script":[{"speaker":"N","text":"スポーツ教室で、先生が話しています。"},{"speaker":"M","text":"練習の記録には、できた回数だけでなく、どんなときに失敗したかも書いてみましょう。私は、疲れた日の最後に、いつも同じ失敗をしていると分かりました。それからは、少し休んでから、もう一度確かめるようにしています。失敗の記録は、自分を責めるためのものではありません。次の練習をどう変えるか、考えるために使うんです。"},{"speaker":"N","text":"話の中心は何ですか。"},{"speaker":"N","text":"1、記録を他の参加者と競うこと","choice":1},{"speaker":"N","text":"2、失敗の記録を練習の改善に役立てること","choice":2},{"speaker":"N","text":"3、疲れていても休まず続けること","choice":3},{"speaker":"N","text":"4、失敗の少ない人だけを選ぶこと","choice":4}]},"N3-L-0244@1":{"uid":"N3-L-0244","revision":1,"audio":"audio/course2026_n3_L0244_v1.mp3","script":[{"speaker":"N","text":"同僚が、重い箱を一人で運ぼうとしています。持つ場所があるので、自分も一緒に運ぶと申し出ます。何と言いますか。"},{"speaker":"N","text":"1、そちらを持ちますから、一緒に運びましょうか。","choice":1},{"speaker":"N","text":"2、その箱を一人で運んでおいてください。","choice":2},{"speaker":"N","text":"3、私の荷物も運んでもらえますか。","choice":3}]},"N3-L-0245@1":{"uid":"N3-L-0245","revision":1,"audio":"audio/course2026_n3_L0245_v1.mp3","script":[{"speaker":"N","text":"職場の電話を取りました。相手が話した会社名を聞き取れなかったので、丁寧にもう一度尋ねます。何と言いますか。"},{"speaker":"N","text":"1、会社の名前はもう分かっています。","choice":1},{"speaker":"N","text":"2、恐れ入りますが、会社名をもう一度お願いできますか。","choice":2},{"speaker":"N","text":"3、先に私の会社名を覚えてください。","choice":3}]},"N3-L-0246@1":{"uid":"N3-L-0246","revision":1,"audio":"audio/course2026_n3_L0246_v1.mp3","script":[{"speaker":"N","text":"友だちに借りた傘の持ち手を壊してしまいました。返す前に、そのことを謝り、修理代を支払うことについて相談します。何と言いますか。"},{"speaker":"N","text":"1、傘の持ち手が壊れていたから、借りませんでした。","choice":1},{"speaker":"N","text":"2、傘を借りてくれてありがとう。","choice":2},{"speaker":"N","text":"3、ごめん、持ち手を壊してしまって。修理代を払わせてもらえないかな。","choice":3}]},"N3-L-0247@1":{"uid":"N3-L-0247","revision":1,"audio":"audio/course2026_n3_L0247_v1.mp3","script":[{"speaker":"N","text":"教室の窓から冷たい風が入り、隣の人が寒そうにしています。窓を閉めてもよいか、その人に確認します。何と言いますか。"},{"speaker":"N","text":"1、寒そうですね。窓を閉めてもいいですか。","choice":1},{"speaker":"N","text":"2、窓を閉めたことを忘れてください。","choice":2},{"speaker":"N","text":"3、私が寒いかどうか聞いてください。","choice":3}]},"N3-L-0248@1":{"uid":"N3-L-0248","revision":1,"audio":"audio/course2026_n3_L0248_v1.mp3","script":[{"speaker":"N","text":"同僚から夕食に誘われました。今日は家族と約束があるため断り、別の日なら行きたいと伝えます。何と言いますか。"},{"speaker":"N","text":"1、今日の家族との約束を守らなくていいですか。","choice":1},{"speaker":"N","text":"2、今日は家族と約束があるんです。また別の日に誘ってください。","choice":2},{"speaker":"N","text":"3、家族と食事をしたので、今から必ず行きます。","choice":3}]},"N3-L-0249@2":{"uid":"N3-L-0249","revision":2,"audio":"audio/course2 て絵を最後に見せますか。"},{"speaker":"F","text":"山口君、あしたの発表、最初に絵を見せるんだったよね。"},{"speaker":"M","text":"そのつもりだったんだけど、先生に言われて変えたんだ。"},{"speaker":"F","text":"え、絵はいつ見せるの?"},{"speaker":"M","text":"話が全部終わってから見せる。最後だよ。"},{"speaker":"F","text":"どうして? 絵がまだできていないの?"},{"speaker":"M","text":"絵はもうできてるよ。先に見せると、みんなが絵ばかり見て、話を聞かないんだって。"},{"speaker":"F","text":"なるほどね。じゃあ、そのとき電気を暗くする?"},{"speaker":"M","text":"うん、絵を見せるときだけ暗くしよう。"},{"speaker":"N","text":"男の人は、どうして絵を最後に見せますか。"}]},"N4-L-0045@2":{"uid":"N4-L-0045","revision":2,"audio":"audio/course2026_n4_L0045_v2.mp3","script":[{"speaker":"N","text":"学校で、女の人と男の人が話しています。男の人は、お祭りに何時から出ますか。"},{"speaker":"F","text":"川口君、日曜日のお祭り、朝から手伝ってくれない?"},{"speaker":"M","text":"すみません、午前中は試験の勉強会があるんです。"},{"speaker":"F","text":"何時に終わるの?"},{"speaker":"M","text":"十一時までです。うちに帰ってから行くと、一時になってしまいます。"},{"speaker":"F","text":"お祭りは十時から三時までなの。一時からだと短いなあ。"},{"speaker":"M","text":"勉強会のあと、まっすぐ行きます。それなら一時間で着きます。"},{"speaker":"F","text":"じゃあ、そのほうがいいね。十時から二時間は私がやっておいてあげる。"},{"speaker":"M","text":"すみません、よろしくお願いします。"},{"speaker":"N","text":"男の人は、お祭りに何時から出ますか。"}]},"N4-L-0046@1":{"uid":"N4-L-0046","revision":1,"audio":"audio/n4_q3_01.mp3","script":[{"speaker":"N","text":"お祭りの入り口です。友だちに安い券のことを教えてあげたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、安い券を買っておけばよかったです。","choice":1},{"speaker":"F","text":"に、安い券はどこで売っていますか。","choice":2},{"speaker":"F","text":"さん、こっちの券のほうが安いですよ。","choice":3}]},"N4-L-0047@1":{"uid":"N4-L-0047","revision":1,"audio":"audio/n4_q3_02.mp3","script":[{"speaker":"N","text":"会社に来たお客さんが、町のお祭りの写真を見せてくれました。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、写真をとってきてくださいね。","choice":1},{"speaker":"M","text":"に、とてもきれいなお祭りですね。","choice":2},{"speaker":"M","text":"さん、あまりおもしろくなさそうですね。","choice":3}]},"N4-L-0048@2":{"uid":"N4-L-0048","revision":2,"audio":"audio/n4_q3_03.mp3","script":[{"speaker":"N","text":"近所の人が、ごみの出し方をていねいに教えてくれました。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、ご親切に、ありがとうございます。","choice":1},{"speaker":"F","text":"に、教えてくださって、よかったですね。","choice":2},{"speaker":"F","text":"さん、今度、ごみの出し方を教えましょうか。","choice":3}]},"N4-L-0049@1":{"uid":"N4-L-0049","revision":1,"audio":"audio/n4_q3_04.mp3","script":[{"speaker":"N","text":"自転車の店です。自転車のブレーキを直してほしいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、ブレーキはもう直りましたか。","choice":1},{"speaker":"M","text":"に、ブレーキを直していただけませんか。","choice":2},{"speaker":"M","text":"さん、ブレーキを直してさしあげましょうか。","choice":3}]},"N4-L-0050@1":{"uid":"N4-L-0050","revision":1,"audio":"audio/n4_q3_05.mp3","script":[{"speaker":"N","text":"友だちの家に犬がいます。さわってもいいか知りたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、この犬、さわってもいいですか。","choice":1},{"speaker":"F","text":"に、さっき犬をさわってしまいました。","choice":2},{"speaker":"F","text":"さん、その犬にはさわらないでくださいね。","choice":3}]},"N4-L-0051@1":{"uid":"N4-L-0051","revision":1,"audio":"audio/n4_q3_06.mp3","script":[{"speaker":"N","text":"会社です。夜の日本語教室に行くため、早く帰りたいです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、早く帰ってもよかったでしょうか。","choice":1},{"speaker":"M","text":"に、早く帰らせていただけませんか。","choice":2},{"speaker":"M","text":"さん、今日は早く帰ってくださいませんか。","choice":3}]},"N4-L-0052@1":{"uid":"N4-L-0052","revision":1,"audio":"audio/n4_q3_07.mp3","script":[{"speaker":"N","text":"クラスの友だちが、旅行から帰って元気がありません。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"F","text":"いち、旅行、楽しみですね。行ってらっしゃい。","choice":1},{"speaker":"F","text":"に、どうしたんですか。大丈夫ですか。","choice":2},{"speaker":"F","text":"さん、元気がないので、休ませてください。","choice":3}]},"N4-L-0053@1":{"uid":"N4-L-0053","revision":1,"audio":"audio/n4_q3_08.mp3","script":[{"speaker":"N","text":"学校の事務室です。係の人が飲み物の箱を運んでいて大変そうです。"},{"speaker":"N","text":"こんなとき、何と言いますか。"},{"speaker":"M","text":"いち、わたしが運びましょうか。","choice":1},{"speaker":"M","text":"に、運んでいただけませんか。","choice":2},{"speaker":"M","text":"さん、重かったでしょう。お疲れさまでした。","choice":3}]},"N4-L-0054@1":{"uid":"N4-L-0054","revision":1,"audio":"audio/n4_q3_09.mp3","script":[{"speaker":"N","text":"不動産屋です。ペットがだめな部屋をすすめられましたが、犬がいます。"},{"speaker":"N","te の物を出すよ。"},{"speaker":"N","text":"息子は、まず何をしますか。"}]},"N4-L-0086@1":{"uid":"N4-L-0086","revision":1,"audio":"audio/course2026_n4_L0086_v1.mp3","script":[{"speaker":"N","text":"学校で、男の先生と女の学生が話しています。女の学生は、まず何をしますか。"},{"speaker":"M","text":"発表で使う写真、メールで送ってくれましたね。"},{"speaker":"F","text":"はい。四枚入れました。印刷しておきましょうか。"},{"speaker":"M","text":"印刷は私がします。一枚目の写真が暗くて、顔がよく見えないんです。ほかの写真はありませんか。"},{"speaker":"F","text":"同じ所で撮ったのが、もう一枚あります。家のパソコンに入っています。"},{"speaker":"M","text":"では、今夜、それに替えて送ってください。発表の文はよく書けていますから、そのままで大丈夫です。"},{"speaker":"F","text":"分かりました。家に帰って、写真を選びます。"},{"speaker":"N","text":"女の学生は、まず何をしますか。"}]},"N4-L-0087@1":{"uid":"N4-L-0087","revision":1,"audio":"audio/course2026_n4_L0087_v1.mp3","script":[{"speaker":"N","text":"店で、男の客と女の店員が話しています。男の人は次に何をしますか。"},{"speaker":"M","text":"このズボン、少し長いんです。短くしてもらえますか。"},{"speaker":"F","text":"はい。どのくらい短くするか、はいて見せていただけますか。"},{"speaker":"M","text":"分かりました。あ、靴は脱いだほうがいいですか。"},{"speaker":"F","text":"いえ、いつも使う靴をはいたままでお願いします。長さを決めてから、こちらの紙にお名前を書いてください。"},{"speaker":"M","text":"お金は今ですか。"},{"speaker":"F","text":"お受け取りのときで結構です。出来上がりは来週の月曜日になります。"},{"speaker":"N","text":"男の人は次に何をしますか。"}]},"N4-L-0088@1":{"uid":"N4-L-0088","revision":1,"audio":"audio/course2026_n4_L0088_v1.mp3","script":[{"speaker":"N","text":"料理教室で、女の先生と男の学生が話しています。男の学生は、まず何をしますか。"},{"speaker":"F","text":"スープのお湯、わきましたか。"},{"speaker":"M","text":"はい。もう野菜を入れてもいいですか。"},{"speaker":"F","text":"にんじんはどのくらいの大きさに切りましたか。"},{"speaker":"M","text":"これです。大きいですか。"},{"speaker":"F","text":"ええ。ほかの野菜より大きいと、にんじんだけ固いままになりますから、もう半分に切ってください。お湯はまだ使わないので、火を止めてからお願いします。"},{"speaker":"M","text":"分かりました。火を止めて、それから切ります。"},{"speaker":"F","text":"切ったら、ほかの野菜と一緒に入れましょう。"},{"speaker":"N","text":"男の学生は、まず何をしますか。"}]},"N4-L-0089@1":{"uid":"N4-L-0089","revision":1,"audio":"audio/course2026_n4_L0089_v1.mp3","script":[{"speaker":"N","text":"男の人と女の人が話しています。男の人は、どうして自転車で行きませんか。"},{"speaker":"F","text":"今日はバスで来たの？いつも自転車なのに。"},{"speaker":"M","text":"昨日、駅で自転車を倒してしまって、ライトがつかなくなったんだ。帰りは暗くなるから、直るまで使わないことにした。"},{"speaker":"F","text":

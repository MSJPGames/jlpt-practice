name: Japanese education news
on:
  schedule:
    - cron: '23 0,12 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/japanese-education-news.yml'
      - 'scripts/update_japanese_education_news.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: japanese-education-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 scripts/update_japanese_education_news.py
      - name: Save feed
        run: |
          git add japanese-education-news.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update Japanese education news"
          git pull --rebase
          git push

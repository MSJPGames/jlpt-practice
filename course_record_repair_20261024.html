<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>確認用記録の修復｜日本語の部屋</title>
<style>body{font:17px/1.8 system-ui,sans-serif;background:#f7f5f0;color:#222;margin:0;padding:24px}main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:14px}button,a{font:inherit}button{padding:14px;background:#276450;color:white;border:0;border-radius:9px;margin:12px 0;min-height:48px}button:disabled{opacity:.5}li{overflow-wrap:anywhere}a{color:#276450}</style>
<main><h1>確認用記録の修復</h1><p>この端末の確認用2件だけを取り除き、もともとの学習記録を残します。実行前のバックアップを端末内に保管します。</p><p id="status" role="status"></p><ol id="items"></ol><button id="repair" disabled>バックアップして確認用2件を取り除く</button><br><button id="undo" hidden>直前の修復を取り消す</button><p><a href="course_listening_2026.html">聴解室へ戻る</a></p></main>
<script>
(()=>{'use strict';const K='nihongo-course-2026-progress',A=K+'-answers',B=K+'-test-repair-backup-20261024',UID='N5-L-0049',AUTH='nihongo-course-2026-auth',HASH='7c72529c82abf11c53a8e74c81be1d79f68688afd542f6f53f3bf48987c57274';const $=id=>document.getElementById(id);let snapshot;
function plan(rawStats,rawAnswers){const s=JSON.parse(rawStats),rs=JSON.parse(rawAnswers);if(!s||!Array.isArray(rs)||rs.length!==3||s.attempts!==3||s.correct!==2||!Array.isArray(s.wrong)||s.wrong.length!==0)throw Error('想定した確認記録と一致しません。変更せずに停止しました。');const [original,wrong,right]=rs;if(original.uid===UID||original.ok!==true||wrong.uid!==UID||wrong.ok!==false||right.uid!==UID||right.ok!==true||wrong.selected!=='この本を売ってください。'||right.selected!=='すみません、使い方を教えてください。'||wrong.question?.id!==right.question?.id||wrong.at>=right.at||!/^2026-10-24T/.test(wrong.at)||!/^2026-10-24T/.test(right.at))throw Error('確認用2件を特定できません。変更せずに停止しました。');if(!Array.isArray(s.answered)||!s.answered.includes(UID)||!s.answered.includes(original.uid))throw Error('解答済み管理が一致しません。変更せずに停止しました。');return {stats:{...s,attempts:s.attempts-2,correct:s.correct-1,answered:s.answered.filter(u=>u!==UID)},answers:[original],removed:[wrong,right]}}
function show(){try{if(sessionStorage.getItem(AUTH)!==HASH)throw Error('先に聴解室でログインしてください。');const rawStats=localStorage.getItem(K),rawAnswers=localStorage.getItem(A);const p=plan(rawStats,rawAnswers);snapshot={rawStats,rawAnswers};$('items').replaceChildren();for(const r of p.removed){const li=document.createElement('li');li.textContent=r.uid+' ／ '+new Date(r.at).toLocaleString('ja-JP',{timeZone:'Asia/Hong_Kong'})+'（香港時間）／ '+(r.ok?'復習で正解':'確認用の誤答');$('items').append(li)}$('status').textContent='削除対象：確認用2件。保持対象：もともとの1件。';$('repair').disabled=false}catch(e){$('status').textContent=e.message;$('repair').disabled=true}}
$('repair').onclick=()=>{try{if(!snapshot||localStorage.getItem(K)!==snapshot.rawStats||localStorage.getItem(A)!==snapshot.rawAnswers)throw Error('他のタブで記録が変わりました。変更せず停止しました。');const p=plan(snapshot.rawStats,snapshot.rawAnswers),after={stats:JSON.stringify(p.stats),answers:JSON.stringify(p.answers)};localStorage.setItem(B,JSON.stringify({...snapshot,after,at:new Date().toISOString()}));try{localStorage.setItem(A,after.answers);localStorage.setItem(K,after.stats)}catch(e){localStorage.setItem(A,snapshot.rawAnswers);localStorage.setItem(K,snapshot.rawStats);throw e}if(localStorage.getItem(A)!==after.answers||localStorage.getItem(K)!==after.stats)throw Error('保存結果を確認できません。');$('status').textContent='修復完了：確認用2件を取り除きました。もともとの1件は内容を変えずに保持しました。解答1問・正解1問・復習待ち0問です。';$('repair').disabled=true;$('undo').hidden=false}catch(e){$('status').textContent=e.message}};
$('undo').onclick=()=>{try{const b=JSON.parse(localStorage.getItem(B));if(!b||localStorage.getItem(K)!==b.after.stats||localStorage.getItem(A)!==b.after.answers)throw Error('修復後に記録が変わったため、上書きせず停止しました。');localStorage.setItem(A,b.rawAnswers);localStorage.setItem(K,b.rawStats);$('status').textContent='修復前の状態へ戻しました。';$('undo').hidden=true;show()}catch(e){$('status').textContent=e.message}};
show();})();
</script></html>
